<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IRONHELL</title>
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
#fps { position: fixed; top: 4px; left: 4px; color: #0f0; font: 14px monospace; z-index: 10; }
</style>
</head>
<body>
<div id="fps">0 FPS</div>
<canvas id="c"></canvas>
<script>
'use strict';

// ========== CONFIG ==========
const W = 320, H = 200;
const FOV = Math.PI / 3;
const MOVE_SPEED = 3.5;
const RUN_MULT = 1.8;
const ROT_SPEED = 0.003;
const PLAYER_RADIUS = 0.2;
const MAX_DEPTH = 20;
const TEX_SIZE = 64;
const DOOR_SPEED = 2.0;
const HUD_H = 32;
const ROCKET_SPLASH_RADIUS = 3.0;
const ROCKET_SPLASH_DAMAGE = 30;

// ========== TEXTURES ==========
const textures = {};

function createTexture(name, drawFn) {
  const cv = document.createElement('canvas');
  cv.width = TEX_SIZE; cv.height = TEX_SIZE;
  const tc = cv.getContext('2d');
  drawFn(tc, TEX_SIZE);
  textures[name] = tc.getImageData(0, 0, TEX_SIZE, TEX_SIZE).data;
}

function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return (s >> 16) / 32767; };
}

createTexture('rustyMetal', (tc, S) => {
  const rng = seededRand(42);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const v = 80 + rng() * 60;
    const rust = rng() > 0.7 ? 30 : 0;
    tc.fillStyle = `rgb(${v + rust},${v - 10},${v - 20})`;
    tc.fillRect(x, y, 1, 1);
  }
  // Rivets
  for (let ry = 4; ry < S; ry += 16) for (let rx = 4; rx < S; rx += 16) {
    tc.fillStyle = '#555';
    tc.beginPath(); tc.arc(rx, ry, 2, 0, Math.PI * 2); tc.fill();
  }
});

createTexture('concrete', (tc, S) => {
  const rng = seededRand(99);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const v = 100 + rng() * 40;
    tc.fillStyle = `rgb(${v},${v},${v + 5})`;
    tc.fillRect(x, y, 1, 1);
  }
  // Cracks
  tc.strokeStyle = '#666'; tc.lineWidth = 1;
  tc.beginPath(); tc.moveTo(10, 0); tc.lineTo(30, 32); tc.lineTo(20, 64); tc.stroke();
});

createTexture('techPanel', (tc, S) => {
  tc.fillStyle = '#334'; tc.fillRect(0, 0, S, S);
  tc.fillStyle = '#445'; tc.fillRect(4, 4, S - 8, S - 8);
  tc.fillStyle = '#0a0'; tc.fillRect(20, 20, 8, 8);
  tc.fillStyle = '#a00'; tc.fillRect(36, 20, 8, 8);
  // Horizontal lines
  for (let y = 10; y < S; y += 12) {
    tc.strokeStyle = '#556'; tc.lineWidth = 1;
    tc.beginPath(); tc.moveTo(4, y); tc.lineTo(S - 4, y); tc.stroke();
  }
});

createTexture('door', (tc, S) => {
  tc.fillStyle = '#654'; tc.fillRect(0, 0, S, S);
  tc.fillStyle = '#543'; tc.fillRect(2, 2, S - 4, S / 2 - 4);
  tc.fillStyle = '#543'; tc.fillRect(2, S / 2 + 2, S - 4, S / 2 - 4);
  tc.fillStyle = '#876'; tc.fillRect(S - 14, S / 2 - 4, 6, 8);
});

createTexture('doorRed', (tc, S) => {
  tc.fillStyle = '#822'; tc.fillRect(0, 0, S, S);
  tc.fillStyle = '#a33'; tc.fillRect(2, 2, S - 4, S - 4);
  tc.fillStyle = '#f44'; tc.fillRect(S / 2 - 8, S / 2 - 8, 16, 16);
  tc.fillStyle = '#faa'; tc.fillRect(S / 2 - 4, S / 2 - 4, 8, 8);
});

createTexture('doorBlue', (tc, S) => {
  tc.fillStyle = '#228'; tc.fillRect(0, 0, S, S);
  tc.fillStyle = '#33a'; tc.fillRect(2, 2, S - 4, S - 4);
  tc.fillStyle = '#44f'; tc.fillRect(S / 2 - 8, S / 2 - 8, 16, 16);
  tc.fillStyle = '#aaf'; tc.fillRect(S / 2 - 4, S / 2 - 4, 8, 8);
});

createTexture('doorYellow', (tc, S) => {
  tc.fillStyle = '#882'; tc.fillRect(0, 0, S, S);
  tc.fillStyle = '#aa3'; tc.fillRect(2, 2, S - 4, S - 4);
  tc.fillStyle = '#ff4'; tc.fillRect(S / 2 - 8, S / 2 - 8, 16, 16);
  tc.fillStyle = '#ffa'; tc.fillRect(S / 2 - 4, S / 2 - 4, 8, 8);
});

createTexture('exitSwitch', (tc, S) => {
  tc.fillStyle = '#333'; tc.fillRect(0, 0, S, S);
  tc.fillStyle = '#444'; tc.fillRect(4, 4, S - 8, S - 8);
  tc.fillStyle = '#0f0'; tc.fillRect(S / 2 - 10, S / 2 - 10, 20, 20);
  tc.strokeStyle = '#fff'; tc.lineWidth = 2;
  tc.strokeRect(S / 2 - 10, S / 2 - 10, 20, 20);
  // "EXIT" text approximation
  tc.fillStyle = '#000';
  tc.fillRect(S / 2 - 6, S / 2 - 4, 12, 8);
  tc.fillStyle = '#0f0';
  tc.fillRect(S / 2 - 4, S / 2 - 2, 8, 4);
});

// Wall type to texture mapping
const WALL_TEXTURES = { 1: 'rustyMetal', 2: 'concrete', 3: 'techPanel' };

// ========== MAP ==========
const MAP_DATA = [
  "################",
  "#..............#",
  "#..r.....s.....#",
  "#....####......#",
  "#..h.#..#......#",
  "#....#..R......#",
  "#....####..g...#",
  "#..............#",
  "#......P.......#",
  "#..............#",
  "#..b.....w.....#",
  "#.......####...#",
  "#.......#..B...#",
  "#..f....#..#...#",
  "#..D....#X.#...#",
  "################"
];

const mapW = MAP_DATA[0].length;
const mapH = MAP_DATA.length;
const map = [];
const doors = [];
let startX = 8.5, startY = 8.5;

// Cell types: 0=floor, 1=wall(rusty), 2=wall(concrete), 3=wall(tech),
// 10=door, 11=redDoor, 12=blueDoor, 13=yellowDoor, 20=exit
// Items on floor: stored separately
const floorItems = [];

for (let y = 0; y < mapH; y++) {
  map[y] = [];
  for (let x = 0; x < mapW; x++) {
    const ch = MAP_DATA[y][x];
    switch (ch) {
      case 'P': startX = x + 0.5; startY = y + 0.5; map[y][x] = 0; break;
      case '#': map[y][x] = 1; break;
      case 'D': map[y][x] = 10; doors.push({ x, y, type: 'door', open: 0, opening: false, locked: null }); break;
      case 'R': map[y][x] = 11; doors.push({ x, y, type: 'doorRed', open: 0, opening: false, locked: 'red' }); break;
      case 'B': map[y][x] = 12; doors.push({ x, y, type: 'doorBlue', open: 0, opening: false, locked: 'blue' }); break;
      case 'Y': map[y][x] = 13; doors.push({ x, y, type: 'doorYellow', open: 0, opening: false, locked: 'yellow' }); break;
      case 'X': map[y][x] = 20; break;
      case 'r': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'key_red', picked: false }); break;
      case 'b': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'key_blue', picked: false }); break;
      case 'y': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'key_yellow', picked: false }); break;
      case 'h': case 's': case 'g': case 'w': case 'f':
        map[y][x] = 0; break; // enemies parsed in second pass
      default: map[y][x] = 0; break;
    }
  }
}

function getCell(x, y) {
  const mx = Math.floor(x);
  const my = Math.floor(y);
  if (mx < 0 || mx >= mapW || my < 0 || my >= mapH) return 1;
  return map[my][mx];
}

function isSolid(x, y) {
  const cell = getCell(x, y);
  if (cell >= 1 && cell <= 3) return true; // walls
  if (cell === 20) return true; // exit switch wall
  if (cell >= 10 && cell <= 13) {
    // Door — check if fully open
    const door = doors.find(d => d.x === Math.floor(x) && d.y === Math.floor(y));
    if (door && door.open >= 0.9) return false;
    return true;
  }
  return false;
}

function isWall(x, y) { return isSolid(x, y); }

// ========== ENEMIES ==========
const ENEMY_TYPES = {
  h: { name: 'Husk', type: 'husk', hp: 40, speed: 1.2, damage: 10, range: 1.2, color: '#a64', attackRate: 0.8, melee: true, drops: 'bullets' },
  s: { name: 'Spitter', type: 'spitter', hp: 30, speed: 1.5, damage: 8, range: 10, color: '#4a4', attackRate: 1.2, melee: false, drops: 'cells' },
  g: { name: 'Hound', type: 'hound', hp: 25, speed: 3.0, damage: 12, range: 1.5, color: '#888', attackRate: 0.5, melee: true, drops: 'shells' },
  w: { name: 'Warden', type: 'warden', hp: 80, speed: 1.0, damage: 15, range: 12, color: '#66a', attackRate: 1.5, melee: false, drops: 'rockets' },
  f: { name: 'Floater', type: 'floater', hp: 50, speed: 2.0, damage: 10, range: 8, color: '#a4a', attackRate: 1.0, melee: false, drops: 'cells' }
};

const enemies = [];

function hasLineOfSight(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const steps = Math.ceil(dist * 4);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const cx = x1 + dx * t;
    const cy = y1 + dy * t;
    const mx = Math.floor(cx);
    const my = Math.floor(cy);
    if (mx >= 0 && mx < mapW && my >= 0 && my < mapH) {
      const cell = map[my][mx];
      if (cell >= 1 && cell <= 3) return false;
      if (cell >= 10 && cell <= 13) {
        const door = doors.find(d => d.x === mx && d.y === my);
        if (!door || door.open < 0.9) return false;
      }
    }
  }
  return true;
}

function spawnEnemy(ch, x, y) {
  const def = ENEMY_TYPES[ch];
  if (!def) return;
  enemies.push({
    x: x + 0.5, y: y + 0.5,
    type: def.type, name: def.name,
    hp: def.hp, maxHp: def.hp,
    speed: def.speed, damage: def.damage, range: def.range,
    color: def.color, attackRate: def.attackRate, melee: def.melee,
    drops: def.drops,
    state: 'idle', // idle, alert, chase, attack, pain, dead
    target: null, // null = player, or another enemy object
    attackCooldown: 0,
    painTimer: 0,
    animFrame: 0,
    animTimer: 0
  });
}

// Parse enemies from map
for (let y = 0; y < mapH; y++) {
  for (let x = 0; x < mapW; x++) {
    const ch = MAP_DATA[y][x];
    if ('hsgwf'.includes(ch)) spawnEnemy(ch, x, y);
  }
}

let lastShotTime = 0;

function alertNearbyEnemies(x, y, radius) {
  for (const e of enemies) {
    if (e.state === 'dead') continue;
    if (e.state !== 'idle') continue;
    const dx = e.x - x;
    const dy = e.y - y;
    if (dx * dx + dy * dy < radius * radius) {
      if (hasLineOfSight(e.x, e.y, player.x, player.y)) {
        e.state = 'alert';
        e.target = null;
      }
    }
  }
}

function damageEnemy(enemy, dmg, attacker) {
  if (enemy.state === 'dead') return;
  enemy.hp -= dmg;
  if (enemy.hp <= 0) {
    enemy.state = 'dead';
    // Drop ammo
    if (enemy.drops) {
      floorItems.push({ x: enemy.x, y: enemy.y, type: 'ammo_' + enemy.drops, picked: false });
    }
    return;
  }
  enemy.state = 'pain';
  enemy.painTimer = 0.2;
  // Infighting: if damaged by another enemy, target that enemy
  if (attacker && attacker !== enemy) {
    enemy.target = attacker;
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.state === 'dead') continue;

    e.animTimer += dt;
    if (e.animTimer > 0.2) {
      e.animFrame = (e.animFrame + 1) % 4;
      e.animTimer = 0;
    }

    if (e.attackCooldown > 0) e.attackCooldown -= dt;

    // Pain state
    if (e.state === 'pain') {
      e.painTimer -= dt;
      if (e.painTimer <= 0) {
        e.state = 'chase';
      }
      continue;
    }

    // Determine target position
    let targetX, targetY;
    if (e.target && e.target !== 'player' && e.target.state !== 'dead') {
      targetX = e.target.x;
      targetY = e.target.y;
    } else {
      e.target = null;
      targetX = player.x;
      targetY = player.y;
    }

    const dx = targetX - e.x;
    const dy = targetY - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Idle: check for line of sight to player
    if (e.state === 'idle') {
      if (hasLineOfSight(e.x, e.y, player.x, player.y) && dist < 12) {
        e.state = 'alert';
      }
      continue;
    }

    // Alert → chase
    if (e.state === 'alert') {
      e.state = 'chase';
    }

    // Chase: move toward target
    if (e.state === 'chase' || e.state === 'attack') {
      if (dist < e.range) {
        e.state = 'attack';
        // Attack
        if (e.attackCooldown <= 0) {
          e.attackCooldown = e.attackRate;
          if (e.target === null) {
            // Attack player
            if (hasLineOfSight(e.x, e.y, player.x, player.y)) {
              player.health -= e.damage;
              damageFlash = 0.3;
              screenShake = 3;
            }
          } else {
            // Attack another enemy (infighting)
            damageEnemy(e.target, e.damage, e);
          }
        }
      } else {
        e.state = 'chase';
        // Move toward target
        const nx = dx / dist * e.speed * dt;
        const ny = dy / dist * e.speed * dt;
        const newX = e.x + nx;
        const newY = e.y + ny;
        if (!isSolid(newX, e.y)) e.x = newX;
        if (!isSolid(e.x, newY)) e.y = newY;
      }
    }
  }
}

function renderEnemies() {
  // Sort by distance (farthest first)
  const visible = [];
  for (const e of enemies) {
    if (e.state === 'dead') continue;
    const dx = e.x - player.x;
    const dy = e.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.3 || dist > MAX_DEPTH) continue;

    const angle = Math.atan2(dy, dx) - player.angle;
    let normAngle = angle;
    while (normAngle > Math.PI) normAngle -= Math.PI * 2;
    while (normAngle < -Math.PI) normAngle += Math.PI * 2;
    if (Math.abs(normAngle) > FOV / 2 + 0.2) continue;

    visible.push({ enemy: e, dist, normAngle });
  }

  visible.sort((a, b) => b.dist - a.dist);

  for (const { enemy: e, dist, normAngle } of visible) {
    const screenX = Math.floor(W / 2 + normAngle / FOV * W);
    const spriteH = Math.floor(H / dist * 0.7);
    const spriteW = Math.floor(spriteH * 0.6);
    const sy = Math.floor(H / 2 + spriteH / 2);

    // Z-buffer check — only draw columns not occluded by walls
    let anyVisible = false;
    for (let sx = screenX - spriteW / 2; sx < screenX + spriteW / 2; sx++) {
      const col = Math.floor(sx);
      if (col < 0 || col >= W) continue;
      if (dist < zBuf[col]) { anyVisible = true; break; }
    }
    if (!anyVisible) continue;

    // Draw sprite column by column with z-buffer
    const startCol = Math.max(0, Math.floor(screenX - spriteW / 2));
    const endCol = Math.min(W - 1, Math.floor(screenX + spriteW / 2));

    for (let col = startCol; col <= endCol; col++) {
      if (dist >= zBuf[col]) continue; // behind wall

      const topY = Math.max(0, sy - spriteH);
      const botY = Math.min(H - HUD_H, sy);

      // Body color
      let bodyColor = e.color;
      if (e.state === 'pain') bodyColor = '#fff';
      ctx.fillStyle = bodyColor;
      ctx.fillRect(col, topY + spriteH * 0.2, 1, (botY - topY) * 0.6);

      // Head
      ctx.fillStyle = e.state === 'pain' ? '#faa' : '#da8';
      ctx.fillRect(col, topY, 1, spriteH * 0.2);
    }

    // Eyes (draw once, not per column)
    if (screenX >= 0 && screenX < W && dist < zBuf[Math.min(W - 1, Math.max(0, screenX))]) {
      const topY = sy - spriteH;
      const eyeSize = Math.max(1, spriteH / 16);
      ctx.fillStyle = e.state === 'attack' ? '#f00' : '#ff0';
      ctx.fillRect(screenX - eyeSize * 2, topY + spriteH * 0.08, eyeSize, eyeSize);
      ctx.fillRect(screenX + eyeSize, topY + spriteH * 0.08, eyeSize, eyeSize);
    }
  }
}

// ========== INPUT ==========
const keysDown = {};
let mouseDX = 0;
let usePressed = false;

let fireHeld = false;

document.addEventListener('keydown', e => {
  keysDown[e.code] = true;
  if (e.code === 'KeyE') usePressed = true;
  // Weapon switching with number keys
  if (e.code >= 'Digit1' && e.code <= 'Digit6') {
    switchWeapon(parseInt(e.code.charAt(5)) - 1);
  }
});
document.addEventListener('keyup', e => { keysDown[e.code] = false; });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement) mouseDX += e.movementX;
});
document.addEventListener('mousedown', e => {
  if (e.button === 0 && document.pointerLockElement) fireHeld = true;
});
document.addEventListener('mouseup', e => {
  if (e.button === 0) fireHeld = false;
});
document.addEventListener('wheel', e => {
  if (document.pointerLockElement) {
    const dir = e.deltaY > 0 ? 1 : -1;
    switchWeapon((currentWeapon + dir + weapons.length) % weapons.length);
  }
});

const canvas = document.getElementById('c');
canvas.addEventListener('click', () => { canvas.requestPointerLock(); });

// ========== PLAYER ==========
let gameState = 'playing';

const player = {
  x: startX,
  y: startY,
  angle: 0,
  health: 100,
  armour: 0,
  keys: []
};

// ========== WEAPONS ==========
const weapons = [
  { name: 'Rivet Driver', ammoType: 'bullets', ammoCost: 1, damage: 15, fireRate: 0.3, spread: 0.02, pellets: 1, splash: 0, color: '#cc8' },
  { name: 'Scatter Bore', ammoType: 'shells', ammoCost: 1, damage: 10, fireRate: 0.7, spread: 0.1, pellets: 7, splash: 0, color: '#fa0' },
  { name: 'Chain Rivet', ammoType: 'bullets', ammoCost: 1, damage: 12, fireRate: 0.08, spread: 0.04, pellets: 1, splash: 0, color: '#ff0' },
  { name: 'Thermal Lance', ammoType: 'cells', ammoCost: 2, damage: 40, fireRate: 0.5, spread: 0, pellets: 1, splash: 0, color: '#0ff' },
  { name: 'Breach Launcher', ammoType: 'rockets', ammoCost: 1, damage: 80, fireRate: 0.8, spread: 0, pellets: 1, splash: ROCKET_SPLASH_RADIUS, color: '#f80' },
  { name: 'The Core', ammoType: 'cells', ammoCost: 10, damage: 200, fireRate: 2.0, spread: 0, pellets: 1, splash: 5, color: '#f0f' }
];

const ammo = { bullets: Infinity, shells: 20, rockets: 5, cells: 20 };
let currentWeapon = 0;
let fireCooldown = 0;
let weaponBob = 0;
let weaponRecoil = 0;
let muzzleFlash = 0;
let screenShake = 0;
let damageFlash = 0;

function switchWeapon(idx) {
  if (idx >= 0 && idx < weapons.length) currentWeapon = idx;
}

function fireWeapon() {
  if (fireCooldown > 0) return;
  const w = weapons[currentWeapon];
  if (ammo[w.ammoType] < w.ammoCost) return;
  if (ammo[w.ammoType] !== Infinity) ammo[w.ammoType] -= w.ammoCost;
  fireCooldown = w.fireRate;
  weaponRecoil = 6;
  muzzleFlash = 0.08;
  screenShake = 2;

  // Alert nearby enemies on weapon fire
  alertNearbyEnemies(player.x, player.y, 15);

  // Hitscan damage to enemies
  for (let p = 0; p < w.pellets; p++) {
    const spread = (Math.random() - 0.5) * w.spread * 2;
    const angle = player.angle + spread;
    const ray = castRay(player.x, player.y, angle);
    // Check if any enemy is closer than the wall hit
    let closestEnemy = null;
    let closestDist = ray.dist;
    for (const e of enemies) {
      if (e.state === 'dead') continue;
      const edx = e.x - player.x;
      const edy = e.y - player.y;
      const eDist = Math.sqrt(edx * edx + edy * edy);
      if (eDist >= closestDist) continue;
      const eAngle = Math.atan2(edy, edx);
      let diff = eAngle - angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const hitWidth = 0.4 / eDist;
      if (Math.abs(diff) < hitWidth) {
        closestEnemy = e;
        closestDist = eDist;
      }
    }
    if (closestEnemy) {
      damageEnemy(closestEnemy, w.damage, null);
    }
  }

  // Rocket splash hurts player at point of impact
  if (w.splash > 0) {
    const hit = castRay(player.x, player.y, player.angle);
    if (hit.dist < MAX_DEPTH) {
      const hitX = player.x + Math.cos(player.angle) * hit.dist;
      const hitY = player.y + Math.sin(player.angle) * hit.dist;
      const dx = player.x - hitX;
      const dy = player.y - hitY;
      const distToPlayer = Math.sqrt(dx * dx + dy * dy);
      if (distToPlayer < w.splash) {
        const falloff = 1 - distToPlayer / w.splash;
        const splashDmg = Math.floor(ROCKET_SPLASH_DAMAGE * falloff);
        player.health -= splashDmg;
        damageFlash = 0.3;
        screenShake = 5;
      }
    }
  }
}

function tryUseDoor(door) {
  if (door.opening) return;
  if (door.locked) {
    if (!player.keys.includes(door.locked)) return;
  }
  door.opening = true;
}

function activateExit() {
  gameState = 'levelComplete';
}

function handleUse() {
  if (!usePressed) return;
  usePressed = false;

  const lookX = Math.cos(player.angle);
  const lookY = Math.sin(player.angle);
  const checkX = Math.floor(player.x + lookX * 1.2);
  const checkY = Math.floor(player.y + lookY * 1.2);
  const cell = getCell(player.x + lookX * 1.2, player.y + lookY * 1.2);

  if (cell >= 10 && cell <= 13) {
    const door = doors.find(d => d.x === checkX && d.y === checkY);
    if (door) tryUseDoor(door);
  }
  if (cell === 20) {
    activateExit();
  }
}

function pickupItems() {
  for (const item of floorItems) {
    if (item.picked) continue;
    const dx = player.x - item.x;
    const dy = player.y - item.y;
    if (dx * dx + dy * dy < 0.5) {
      item.picked = true;
      if (item.type === 'key_red' && !player.keys.includes('red')) player.keys.push('red');
      if (item.type === 'key_blue' && !player.keys.includes('blue')) player.keys.push('blue');
      if (item.type === 'key_yellow' && !player.keys.includes('yellow')) player.keys.push('yellow');
      if (item.type === 'ammo_bullets' && ammo.bullets !== Infinity) ammo.bullets += 10;
      if (item.type === 'ammo_shells') ammo.shells += 4;
      if (item.type === 'ammo_rockets') ammo.rockets += 2;
      if (item.type === 'ammo_cells') ammo.cells += 10;
    }
  }
}

function updateDoors(dt) {
  for (const door of doors) {
    if (door.opening && door.open < 1) {
      door.open = Math.min(1, door.open + DOOR_SPEED * dt);
    }
    // Auto-open doors when player walks into them
    const dx = player.x - (door.x + 0.5);
    const dy = player.y - (door.y + 0.5);
    if (dx * dx + dy * dy < 1.5 && !door.opening) {
      if (!door.locked || player.keys.includes(door.locked)) {
        door.opening = true;
      }
    }
  }
}

function movePlayer(dt) {
  if (gameState !== 'playing') return;

  let mx = 0, my = 0;
  const cos = Math.cos(player.angle);
  const sin = Math.sin(player.angle);

  if (keysDown['KeyW']) { mx += cos; my += sin; }
  if (keysDown['KeyS']) { mx -= cos; my -= sin; }
  if (keysDown['KeyA']) { mx += sin; my -= cos; }
  if (keysDown['KeyD']) { mx -= sin; my += cos; }

  const len = Math.sqrt(mx * mx + my * my);
  if (len > 0) { mx /= len; my /= len; }

  let speed = MOVE_SPEED;
  if (keysDown['ShiftLeft'] || keysDown['ShiftRight']) speed *= RUN_MULT;

  const dx = mx * speed * dt;
  const dy = my * speed * dt;

  const newX = player.x + dx;
  const newY = player.y + dy;

  if (!isSolid(newX + PLAYER_RADIUS * Math.sign(dx), player.y) &&
      !isSolid(newX - PLAYER_RADIUS * Math.sign(dx), player.y) &&
      !isSolid(newX, player.y + PLAYER_RADIUS) &&
      !isSolid(newX, player.y - PLAYER_RADIUS)) {
    player.x = newX;
  }

  if (!isSolid(player.x, newY + PLAYER_RADIUS * Math.sign(dy)) &&
      !isSolid(player.x, newY - PLAYER_RADIUS * Math.sign(dy)) &&
      !isSolid(player.x + PLAYER_RADIUS, newY) &&
      !isSolid(player.x - PLAYER_RADIUS, newY)) {
    player.y = newY;
  }

  player.angle += mouseDX * ROT_SPEED;
  mouseDX = 0;

  handleUse();
  pickupItems();
}

// ========== RENDER ==========
const ctx = (() => {
  canvas.width = W;
  canvas.height = H;
  function resize() {
    const scaleX = window.innerWidth / W;
    const scaleY = window.innerHeight / H;
    const scale = Math.min(scaleX, scaleY);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  resize();
  window.addEventListener('resize', resize);
  return canvas.getContext('2d');
})();

const imgData = ctx.createImageData(W, H);
const buf = imgData.data;
const zBuf = new Float32Array(W);

function getTextureForCell(cell) {
  if (cell >= 1 && cell <= 3) return textures[WALL_TEXTURES[cell]] || textures['rustyMetal'];
  if (cell === 10) return textures['door'];
  if (cell === 11) return textures['doorRed'];
  if (cell === 12) return textures['doorBlue'];
  if (cell === 13) return textures['doorYellow'];
  if (cell === 20) return textures['exitSwitch'];
  return textures['rustyMetal'];
}

function castRay(ox, oy, angle) {
  const dx = Math.cos(angle);
  const dy = Math.sin(angle);

  let mapX = Math.floor(ox);
  let mapY = Math.floor(oy);

  const stepX = dx >= 0 ? 1 : -1;
  const stepY = dy >= 0 ? 1 : -1;

  let tMaxX = dx !== 0 ? ((dx >= 0 ? mapX + 1 : mapX) - ox) / dx : 1e30;
  let tMaxY = dy !== 0 ? ((dy >= 0 ? mapY + 1 : mapY) - oy) / dy : 1e30;

  const tDeltaX = dx !== 0 ? Math.abs(1 / dx) : 1e30;
  const tDeltaY = dy !== 0 ? Math.abs(1 / dy) : 1e30;

  let side = 0;
  let dist = 0;

  for (let i = 0; i < 64; i++) {
    if (tMaxX < tMaxY) {
      dist = tMaxX;
      tMaxX += tDeltaX;
      mapX += stepX;
      side = 0;
    } else {
      dist = tMaxY;
      tMaxY += tDeltaY;
      mapY += stepY;
      side = 1;
    }

    if (mapX < 0 || mapX >= mapW || mapY < 0 || mapY >= mapH) break;
    const cell = map[mapY][mapX];
    if (cell !== 0) {
      // Doors that are fully open don't block rays
      if (cell >= 10 && cell <= 13) {
        const door = doors.find(d => d.x === mapX && d.y === mapY);
        if (door && door.open >= 0.9) continue;
      }
      // Compute wall hit X for texturing
      let wallX;
      if (side === 0) {
        wallX = oy + dist * dy;
      } else {
        wallX = ox + dist * dx;
      }
      wallX -= Math.floor(wallX);
      return { dist, side, mapX, mapY, cell, wallX };
    }
  }

  return { dist: MAX_DEPTH, side: 0, mapX: 0, mapY: 0, cell: 0, wallX: 0 };
}

function sampleTexture(texData, u, v) {
  const tx = Math.floor(u * TEX_SIZE) & (TEX_SIZE - 1);
  const ty = Math.floor(v * TEX_SIZE) & (TEX_SIZE - 1);
  const idx = (ty * TEX_SIZE + tx) * 4;
  return [texData[idx], texData[idx + 1], texData[idx + 2]];
}

function render() {
  // Floor and ceiling with distance shading
  const halfH = H / 2;
  for (let y = 0; y < H; y++) {
    const isCeiling = y < halfH;
    const rowDist = halfH / Math.abs(y - halfH + 0.01);
    const fog = Math.max(0, Math.min(1, 1 - rowDist / MAX_DEPTH));

    for (let x = 0; x < W; x++) {
      const rayAngle = player.angle - FOV / 2 + (x / W) * FOV;
      const floorX = player.x + rowDist * Math.cos(rayAngle);
      const floorY = player.y + rowDist * Math.sin(rayAngle);

      const idx = (y * W + x) * 4;

      if (isCeiling) {
        const cx = ((floorX * 4) & 7);
        const cy = ((floorY * 4) & 7);
        const checker = ((cx >> 2) ^ (cy >> 2)) ? 50 : 40;
        buf[idx] = Math.floor(checker * fog);
        buf[idx + 1] = Math.floor(checker * fog);
        buf[idx + 2] = Math.floor((checker + 10) * fog);
      } else {
        const fx = ((floorX * 4) & 7);
        const fy = ((floorY * 4) & 7);
        const checker = ((fx >> 2) ^ (fy >> 2)) ? 70 : 55;
        buf[idx] = Math.floor(checker * fog);
        buf[idx + 1] = Math.floor((checker - 10) * fog);
        buf[idx + 2] = Math.floor((checker - 20) * fog);
      }
      buf[idx + 3] = 255;
    }
  }

  // Walls
  for (let col = 0; col < W; col++) {
    const rayAngle = player.angle - FOV / 2 + (col / W) * FOV;
    const hit = castRay(player.x, player.y, rayAngle);

    const perpDist = hit.dist * Math.cos(rayAngle - player.angle);
    zBuf[col] = perpDist;
    const wallH = Math.min(H * 2, H / perpDist);
    const wallTop = Math.floor((H - wallH) / 2);
    const wallBot = Math.floor((H + wallH) / 2);

    const shade = hit.side === 1 ? 0.7 : 1.0;
    const fog = Math.max(0, 1 - perpDist / MAX_DEPTH);
    const tex = getTextureForCell(hit.cell);

    for (let y = Math.max(0, wallTop); y < Math.min(H, wallBot); y++) {
      const v = (y - wallTop) / (wallBot - wallTop);
      const idx = (y * W + col) * 4;

      if (tex) {
        const [tr, tg, tb] = sampleTexture(tex, hit.wallX, v);
        buf[idx] = Math.floor(tr * shade * fog);
        buf[idx + 1] = Math.floor(tg * shade * fog);
        buf[idx + 2] = Math.floor(tb * shade * fog);
      } else {
        buf[idx] = Math.floor(150 * shade * fog);
        buf[idx + 1] = Math.floor(120 * shade * fog);
        buf[idx + 2] = Math.floor(100 * shade * fog);
      }
      buf[idx + 3] = 255;
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Screen shake offset
  const shakeX = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 2 : 0;
  const shakeY = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 2 : 0;
  if (screenShake > 0) ctx.translate(shakeX, shakeY);

  // Draw floor items (keys as sprites)
  for (const item of floorItems) {
    if (item.picked) continue;
    const dx = item.x - player.x;
    const dy = item.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.3 || dist > MAX_DEPTH) continue;

    const angle = Math.atan2(dy, dx) - player.angle;
    let normAngle = angle;
    while (normAngle > Math.PI) normAngle -= Math.PI * 2;
    while (normAngle < -Math.PI) normAngle += Math.PI * 2;

    if (Math.abs(normAngle) > FOV / 2 + 0.1) continue;

    const screenX = Math.floor(W / 2 + normAngle / FOV * W);
    const spriteH = Math.floor(H / dist * 0.3);
    const spriteW = spriteH;
    const sy = Math.floor(H / 2 + spriteH / 2);

    if (dist < zBuf[Math.max(0, Math.min(W - 1, screenX))]) {
      const color = item.type === 'key_red' ? '#f44' : item.type === 'key_blue' ? '#44f' : '#ff4';
      ctx.fillStyle = color;
      ctx.fillRect(screenX - spriteW / 2, sy - spriteH, spriteW, spriteH);
      ctx.fillStyle = '#fff';
      ctx.fillRect(screenX - 1, sy - spriteH + 2, 2, spriteH - 4);
    }
  }

  // Render enemies (billboard sprites)
  renderEnemies();

  // Weapon sprite (bottom center with bob and recoil)
  const w = weapons[currentWeapon];
  const bobX = Math.sin(weaponBob) * 3;
  const bobY = Math.abs(Math.cos(weaponBob)) * 2;
  const recoilY = Math.max(0, weaponRecoil);
  const wpnX = W / 2 - 20 + bobX;
  const wpnY = H - HUD_H - 50 + bobY + recoilY;

  // Muzzle flash
  if (muzzleFlash > 0) {
    ctx.fillStyle = w.color;
    ctx.globalAlpha = muzzleFlash * 10;
    ctx.fillRect(wpnX - 5, wpnY - 15, 50, 15);
    ctx.globalAlpha = 1;
  }

  // Weapon body
  ctx.fillStyle = '#555';
  ctx.fillRect(wpnX, wpnY, 40, 50);
  ctx.fillStyle = '#777';
  ctx.fillRect(wpnX + 5, wpnY, 30, 10);
  ctx.fillStyle = w.color;
  ctx.fillRect(wpnX + 12, wpnY - 5, 16, 8);
  // Barrel
  ctx.fillStyle = '#333';
  ctx.fillRect(wpnX + 16, wpnY - 10, 8, 10);

  // HUD bar (Doom-style bottom bar)
  const hudY = H - HUD_H;
  ctx.fillStyle = '#333';
  ctx.fillRect(0, hudY, W, HUD_H);
  ctx.fillStyle = '#555';
  ctx.fillRect(0, hudY, W, 2);

  ctx.font = '9px monospace';

  // Health
  ctx.fillStyle = '#f44';
  ctx.fillText('HP', 4, hudY + 12);
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.max(0, player.health).toString(), 4, hudY + 24);

  // Armour
  ctx.fillStyle = '#48f';
  ctx.fillText('AR', 44, hudY + 12);
  ctx.fillStyle = '#fff';
  ctx.fillText(player.armour.toString(), 44, hudY + 24);

  // Current ammo
  const curAmmo = ammo[w.ammoType];
  ctx.fillStyle = w.color;
  ctx.fillText(w.name, 84, hudY + 12);
  ctx.fillStyle = '#fff';
  ctx.fillText(curAmmo === Infinity ? 'INF' : curAmmo.toString(), 84, hudY + 24);

  // All ammo counts
  ctx.fillStyle = '#888';
  ctx.font = '7px monospace';
  ctx.fillText(`BUL:${ammo.bullets === Infinity ? 'INF' : ammo.bullets} SHL:${ammo.shells} RKT:${ammo.rockets} CEL:${ammo.cells}`, 160, hudY + 12);

  // Keys in HUD
  const keyColors = { red: '#f44', blue: '#44f', yellow: '#ff4' };
  let kx = 160;
  for (const k of player.keys) {
    ctx.fillStyle = keyColors[k] || '#fff';
    ctx.fillRect(kx, hudY + 16, 10, 10);
    kx += 14;
  }

  // Reactive pixel face (simplified)
  const faceX = W / 2 - 8;
  const faceY = hudY + 4;
  ctx.fillStyle = '#da8';
  ctx.fillRect(faceX, faceY, 16, 20);
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(faceX + 3, faceY + 5, 4, 4);
  ctx.fillRect(faceX + 9, faceY + 5, 4, 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(faceX + 4, faceY + 6, 2, 2);
  ctx.fillRect(faceX + 10, faceY + 6, 2, 2);
  // Mouth - changes with health
  if (player.health > 60) {
    ctx.fillStyle = '#a00';
    ctx.fillRect(faceX + 5, faceY + 14, 6, 3);
  } else if (player.health > 30) {
    ctx.fillStyle = '#a00';
    ctx.fillRect(faceX + 4, faceY + 14, 8, 2);
  } else {
    ctx.fillStyle = '#a00';
    ctx.fillRect(faceX + 3, faceY + 13, 10, 4);
    ctx.fillStyle = '#f00';
    ctx.fillRect(faceX + 5, faceY + 14, 6, 2);
  }

  // Damage flash
  if (damageFlash > 0) {
    ctx.fillStyle = `rgba(255,0,0,${damageFlash * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Reset shake transform
  if (screenShake > 0) ctx.translate(-shakeX, -shakeY);

  // Level complete overlay
  if (gameState === 'levelComplete') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0f0';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL COMPLETE', W / 2, H / 2);
    ctx.textAlign = 'start';
  }
}

// ========== LOOP ==========
let lastTime = 0;
let frameCount = 0;
let fpsTime = 0;
const fpsEl = document.getElementById('fps');

function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  movePlayer(dt);
  updateDoors(dt);
  updateEnemies(dt);

  // Weapon updates
  if (fireCooldown > 0) fireCooldown -= dt;
  if (fireHeld && gameState === 'playing') fireWeapon();
  if (weaponRecoil > 0) weaponRecoil -= dt * 40;
  if (muzzleFlash > 0) muzzleFlash -= dt;
  if (screenShake > 0) screenShake -= dt * 15;
  if (damageFlash > 0) damageFlash -= dt;
  weaponBob += dt * 5;

  render();

  frameCount++;
  fpsTime += dt;
  if (fpsTime >= 1) {
    fpsEl.textContent = Math.round(frameCount / fpsTime) + ' FPS';
    frameCount = 0;
    fpsTime = 0;
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

// ========== DEBUG ==========
window.__IH = {
  get state() { return gameState; },
  set state(v) { gameState = v; },
  get player() { return player; },
  get map() { return map; },
  get mapData() { return MAP_DATA; },
  level: { map, mapW, mapH },
  enemies,
  ENEMY_TYPES,
  hasLineOfSight,
  damageEnemy,
  alertNearbyEnemies,
  spawnEnemy,
  textures,
  doors,
  floorItems,
  weapons,
  ammo,
  get currentWeapon() { return currentWeapon; },
  set currentWeapon(v) { currentWeapon = v; },
  switchWeapon,
  fireWeapon,
  isWall,
  isSolid,
  tryUseDoor,
  activateExit
};

</script>
</body>
</html>
