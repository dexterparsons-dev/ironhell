function createTexture(name, drawFn) {
  const cv = document.createElement('canvas');
  cv.width = TEX_SIZE; cv.height = TEX_SIZE;
  const tc = cv.getContext('2d');
  drawFn(tc, TEX_SIZE);
  textures[name] = tc.getImageData(0, 0, TEX_SIZE, TEX_SIZE).data;
}

function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return (s >> 16) / 32767; };
}

createTexture('rustyMetal', (tc, S) => {
  const rng = seededRand(42);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const v = 80 + rng() * 60;
    const rust = rng() > 0.7 ? 30 : 0;
    tc.fillStyle = `rgb(${v + rust},${v - 10},${v - 20})`;
    tc.fillRect(x, y, 1, 1);
  }
  // Rivets
  for (let ry = 4; ry < S; ry += 16) for (let rx = 4; rx < S; rx += 16) {
    tc.fillStyle = '#555';
    tc.beginPath(); tc.arc(rx, ry, 2, 0, Math.PI * 2); tc.fill();
  }
});

let mapH = 0;

// Cell types: 0=floor, 1=wall(rusty), 2=wall(concrete), 3=wall(tech),

function getCell(x, y) {
  const mx = Math.floor(x);
  const my = Math.floor(y);
  if (mx < 0 || mx >= mapW || my < 0 || my >= mapH) return 1;
  return map[my][mx];
}

function isSolid(x, y) {
  const cell = getCell(x, y);
  if (cell >= 1 && cell <= 3) return true; // walls
  if (cell === 20) return true; // exit switch wall
  if (cell === 40) return true; // secret wall (solid until opened)
  if (cell >= 10 && cell <= 13) {
    // Door -- check if fully open
    const door = doors.find(d => d.x === Math.floor(x) && d.y === Math.floor(y));
    if (door && door.open >= 0.9) return false;
    return true;
  }
  return false;
}

function isWall(x, y) { return isSolid(x, y); }

const enemies = [];

function hasLineOfSight(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const steps = Math.ceil(dist * 4);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const cx = x1 + dx * t;
    const cy = y1 + dy * t;
    const mx = Math.floor(cx);
    const my = Math.floor(cy);
    if (mx >= 0 && mx < mapW && my >= 0 && my < mapH) {
      const cell = map[my][mx];
      if (cell >= 1 && cell <= 3) return false;
      if (cell === 40) return false; // secret walls block LOS
      if (cell >= 10 && cell <= 13) {
        const door = doors.find(d => d.x === mx && d.y === my);
        if (!door || door.open < 0.9) return false;
      }
    }
  }
  return true;
}

function spawnEnemy(ch, x, y) {
  const def = ENEMY_TYPES[ch];
  if (!def) return;
  enemies.push({
    x: x + 0.5, y: y + 0.5,
    type: def.type, name: def.name,
    hp: def.hp, maxHp: def.hp,
    speed: def.speed, damage: def.damage, range: def.range,
    color: def.color, attackRate: def.attackRate, melee: def.melee,
    drops: def.drops,
    state: 'idle', // idle, alert, chase, attack, pain, dead
    target: null, // null = player, or another enemy object
    attackCooldown: 0,
    painTimer: 0,
    animFrame: 0,
    animTimer: 0
  });
}

let lastShotTime = 0;

function alertNearbyEnemies(x, y, radius) {
  for (const e of enemies) {
    if (e.state === 'dead') continue;
    if (e.state !== 'idle') continue;
    const dx = e.x - x;
    const dy = e.y - y;
    if (dx * dx + dy * dy < radius * radius) {
      if (hasLineOfSight(e.x, e.y, player.x, player.y)) {
        e.state = 'alert';
        e.target = null;
      }
    }
  }
}

function damageEnemy(enemy, dmg, attacker) {
  if (enemy.state === 'dead') return;
  enemy.hp -= dmg;
  if (enemy.hp <= 0) {
    enemy.state = 'dead';
    levelStats.kills++;
    // Drop ammo
    if (enemy.drops) {
      floorItems.push({ x: enemy.x, y: enemy.y, type: 'ammo_' + enemy.drops, picked: false });
    }
    return;
  }
  enemy.state = 'pain';
  enemy.painTimer = 0.2;
  // Infighting: if damaged by another enemy, target that enemy
  if (attacker && attacker !== enemy) {
    enemy.target = attacker;
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.state === 'dead') continue;

    e.animTimer += dt;
    if (e.animTimer > 0.2) {
      e.animFrame = (e.animFrame + 1) % 4;
      e.animTimer = 0;
    }

    if (e.attackCooldown > 0) e.attackCooldown -= dt;

    // Pain state
    if (e.state === 'pain') {
      e.painTimer -= dt;
      if (e.painTimer <= 0) {
        e.state = 'chase';
      }
      continue;
    }

    // Determine target position
    let targetX, targetY;
    if (e.target && e.target !== 'player' && e.target.state !== 'dead') {
      targetX = e.target.x;
      targetY = e.target.y;
    } else {
      e.target = null;
      targetX = player.x;
      targetY = player.y;
    }

    const dx = targetX - e.x;
    const dy = targetY - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Idle: check for line of sight to player (skip during grace period)
    if (e.state === 'idle') {
      if (graceTimer <= 0 && hasLineOfSight(e.x, e.y, player.x, player.y) && dist < 12) {
        e.state = 'alert';
      }
      continue;
    }

    // Alert -> chase
    if (e.state === 'alert') {
      e.state = 'chase';
    }

    // Chase: move toward target
    if (e.state === 'chase' || e.state === 'attack') {
      if (dist < e.range) {
        e.state = 'attack';
        // Attack
        if (e.attackCooldown <= 0) {
          e.attackCooldown = e.attackRate;
          if (e.target === null) {
            // Attack player (skip during grace period)
            if (graceTimer <= 0 && hasLineOfSight(e.x, e.y, player.x, player.y)) {
              player.health -= e.damage;
              damageFlash = 0.3;
              screenShake = 3;
            }
          } else {
            // Attack another enemy (infighting)
            damageEnemy(e.target, e.damage, e);
          }
        }
      } else {
        e.state = 'chase';
        // Move toward target
        const nx = dx / dist * e.speed * dt;
        const ny = dy / dist * e.speed * dt;
        const newX = e.x + nx;
        const newY = e.y + ny;
        if (!isSolid(newX, e.y)) e.x = newX;
        if (!isSolid(e.x, newY)) e.y = newY;
      }
    }
  }
}

function renderEnemies() {
  // Sort by distance (farthest first)
  const visible = [];
  for (const e of enemies) {
    if (e.state === 'dead') continue;
    const dx = e.x - player.x;
    const dy = e.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.3 || dist > MAX_DEPTH) continue;

    const angle = Math.atan2(dy, dx) - player.angle;
    let normAngle = angle;
    while (normAngle > Math.PI) normAngle -= Math.PI * 2;
    while (normAngle < -Math.PI) normAngle += Math.PI * 2;
    if (Math.abs(normAngle) > FOV / 2 + 0.2) continue;

    visible.push({ enemy: e, dist, normAngle });
  }

  visible.sort((a, b) => b.dist - a.dist);

  for (const { enemy: e, dist, normAngle } of visible) {
    const screenX = Math.floor(W / 2 + normAngle / FOV * W);
    const spriteH = Math.floor(H / dist * 0.7);
    const spriteW = Math.floor(spriteH * 0.6);
    const sy = Math.floor(H / 2 + spriteH / 2);

    // Z-buffer check
    let anyVisible = false;
    for (let sx = screenX - spriteW / 2; sx < screenX + spriteW / 2; sx++) {
      const col = Math.floor(sx);
      if (col < 0 || col >= W) continue;
      if (dist < zBuf[col]) { anyVisible = true; break; }
    }
    if (!anyVisible) continue;

    const startCol = Math.max(0, Math.floor(screenX - spriteW / 2));
    const endCol = Math.min(W - 1, Math.floor(screenX + spriteW / 2));

    for (let col = startCol; col <= endCol; col++) {
      if (dist >= zBuf[col]) continue;

      const topY = Math.max(0, sy - spriteH);
      const botY = Math.min(H - HUD_H, sy);

      let bodyColor = e.color;
      if (e.state === 'pain') bodyColor = '#fff';
      ctx.fillStyle = bodyColor;
      ctx.fillRect(col, topY + spriteH * 0.2, 1, (botY - topY) * 0.6);

      ctx.fillStyle = e.state === 'pain' ? '#faa' : '#da8';
      ctx.fillRect(col, topY, 1, spriteH * 0.2);
    }

    if (screenX >= 0 && screenX < W && dist < zBuf[Math.min(W - 1, Math.max(0, screenX))]) {
      const topY = sy - spriteH;
      const eyeSize = Math.max(1, spriteH / 16);
      ctx.fillStyle = e.state === 'attack' ? '#f00' : '#ff0';
      ctx.fillRect(screenX - eyeSize * 2, topY + spriteH * 0.08, eyeSize, eyeSize);
      ctx.fillRect(screenX + eyeSize, topY + spriteH * 0.08, eyeSize, eyeSize);
    }
  }
}

// ========== BOSS ==========
const boss = {
  hp: 0,
  maxHp: 500,
  phase: 1,
  x: 0,
  y: 0,
  active: false,
  attackTimer: 0,
  chargeDir: { x: 0, y: 0 },
  beamAngle: 0
};

const bossOrbs = [];

function spawnBoss(cx, cy) {
  boss.hp = boss.maxHp;
  boss.phase = 1;
  boss.x = cx;
  boss.y = cy;
  boss.active = true;
  boss.attackTimer = 0;
  boss.chargeDir = { x: 0, y: 0 };
  boss.beamAngle = 0;
  bossOrbs.length = 0;
}

function updateBossPhase() {
  if (!boss.active) return;
  if (boss.hp <= 0) {
    boss.hp = 0;
    boss.active = false;
    gameState = 'victory';
    levelStats.elapsedTime = (performance.now() - levelStats.startTime) / 1000;
    return;
  }
  const ratio = boss.hp / boss.maxHp;
  if (ratio <= 0.33 && boss.phase < 3) {
    boss.phase = 3;
  } else if (ratio <= 0.66 && boss.phase < 2) {
    boss.phase = 2;
    // Spawn 2 Hounds near the boss
    spawnEnemy('g', Math.floor(boss.x) - 1, Math.floor(boss.y));
    spawnEnemy('g', Math.floor(boss.x) + 1, Math.floor(boss.y));
  }
}

function updateBoss(dt) {
  if (!boss.active) return;
  boss.attackTimer -= dt;

  const dx = player.x - boss.x;
  const dy = player.y - boss.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (boss.phase === 1) {
    // Phase 1: spread volleys of slow orbs
    if (boss.attackTimer <= 0) {
      boss.attackTimer = 2.0;
      const baseAngle = Math.atan2(dy, dx);
      for (let i = -2; i <= 2; i++) {
        const a = baseAngle + i * 0.2;
        bossOrbs.push({ x: boss.x, y: boss.y, dx: Math.cos(a) * 2.5, dy: Math.sin(a) * 2.5, life: 5 });
      }
    }
  } else if (boss.phase === 2) {
    // Phase 2: charge toward player
    if (boss.attackTimer <= 0) {
      boss.attackTimer = 1.5;
      if (dist > 0.1) {
        boss.chargeDir.x = dx / dist;
        boss.chargeDir.y = dy / dist;
      }
    }
    // Move toward player
    const speed = 3.0;
    const nx = boss.x + boss.chargeDir.x * speed * dt;
    const ny = boss.y + boss.chargeDir.y * speed * dt;
    if (!isSolid(nx, ny)) { boss.x = nx; boss.y = ny; }
    // Melee damage on contact (skip during grace period)
    if (graceTimer <= 0 && dist < 1.5) {
      player.health -= 15 * dt;
      damageFlash = 0.15;
    }
  } else if (boss.phase === 3) {
    // Phase 3: sweeping beam attack
    boss.beamAngle += dt * 1.5;
    if (boss.attackTimer <= 0) {
      boss.attackTimer = 0.1;
      // Check if beam hits player (skip during grace period)
      const beamDir = boss.beamAngle % (Math.PI * 2);
      const toPlayer = Math.atan2(dy, dx);
      let diff = beamDir - toPlayer;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (graceTimer <= 0 && Math.abs(diff) < 0.2 && dist < 15) {
        player.health -= 3;
        damageFlash = 0.15;
        screenShake = 2;
      }
    }
  }

  // Update orbs
  for (let i = bossOrbs.length - 1; i >= 0; i--) {
    const orb = bossOrbs[i];
    orb.x += orb.dx * dt;
    orb.y += orb.dy * dt;
    orb.life -= dt;
    if (orb.life <= 0 || isSolid(orb.x, orb.y)) {
      bossOrbs.splice(i, 1);
      continue;
    }
    // Hit player (skip during grace period)
    const pdx = orb.x - player.x;
    const pdy = orb.y - player.y;
    if (graceTimer <= 0 && pdx * pdx + pdy * pdy < 0.5) {
      player.health -= 8;
      damageFlash = 0.2;
      bossOrbs.splice(i, 1);
    }
  }
}

function renderBoss() {
  if (!boss.active) return;

  // Render boss as large billboard sprite
  const dx = boss.x - player.x;
  const dy = boss.y - player.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.3 || dist > MAX_DEPTH) return;

  const angle = Math.atan2(dy, dx) - player.angle;
  let normAngle = angle;
  while (normAngle > Math.PI) normAngle -= Math.PI * 2;
  while (normAngle < -Math.PI) normAngle += Math.PI * 2;
  if (Math.abs(normAngle) > FOV / 2 + 0.3) return;

  const screenX = Math.floor(W / 2 + normAngle / FOV * W);
  const spriteH = Math.floor(H / dist * 1.4);  // Bigger than normal enemies
  const spriteW = Math.floor(spriteH * 0.8);
  const sy = Math.floor(H / 2 + spriteH / 2);

  // Z-buffer check
  let anyVisible = false;
  for (let sx = screenX - spriteW / 2; sx < screenX + spriteW / 2; sx++) {
    const col = Math.floor(sx);
    if (col < 0 || col >= W) continue;
    if (dist < zBuf[col]) { anyVisible = true; break; }
  }
  if (!anyVisible) return;

  const startCol = Math.max(0, Math.floor(screenX - spriteW / 2));
  const endCol = Math.min(W - 1, Math.floor(screenX + spriteW / 2));

  // Color changes by phase
  const bodyColors = { 1: '#a22', 2: '#d42', 3: '#f64' };
  const bodyColor = bodyColors[boss.phase] || '#a22';

  for (let col = startCol; col <= endCol; col++) {
    if (dist >= zBuf[col]) continue;
    const topY = Math.max(0, sy - spriteH);
    const botY = Math.min(H - HUD_H, sy);

    ctx.fillStyle = bodyColor;
    ctx.fillRect(col, topY + spriteH * 0.15, 1, (botY - topY) * 0.7);

    // Head
    ctx.fillStyle = '#da8';
    ctx.fillRect(col, topY, 1, spriteH * 0.15);
  }

  // Eyes
  if (screenX >= 0 && screenX < W && dist < zBuf[Math.min(W - 1, Math.max(0, screenX))]) {
    const topY = sy - spriteH;
    const eyeSize = Math.max(2, spriteH / 10);
    ctx.fillStyle = '#f00';
    ctx.fillRect(screenX - eyeSize * 2, topY + spriteH * 0.05, eyeSize, eyeSize);
    ctx.fillRect(screenX + eyeSize, topY + spriteH * 0.05, eyeSize, eyeSize);
  }

  // Phase 3: render beam
  if (boss.phase === 3) {
    const beamLen = 15;
    const bx = boss.x + Math.cos(boss.beamAngle) * beamLen;
    const by = boss.y + Math.sin(boss.beamAngle) * beamLen;
    // Draw beam as line on screen
    const bAngle = Math.atan2(by - player.y, bx - player.x) - player.angle;
    let bNorm = bAngle;
    while (bNorm > Math.PI) bNorm -= Math.PI * 2;
    while (bNorm < -Math.PI) bNorm += Math.PI * 2;
    const bScreenX = Math.floor(W / 2 + bNorm / FOV * W);
    ctx.strokeStyle = '#f44';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(screenX, sy - spriteH / 2);
    ctx.lineTo(bScreenX, sy - spriteH / 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Render orbs
  for (const orb of bossOrbs) {
    const odx = orb.x - player.x;
    const ody = orb.y - player.y;
    const oDist = Math.sqrt(odx * odx + ody * ody);
    if (oDist < 0.3 || oDist > MAX_DEPTH) continue;
    const oAngle = Math.atan2(ody, odx) - player.angle;
    let oNorm = oAngle;
    while (oNorm > Math.PI) oNorm -= Math.PI * 2;
    while (oNorm < -Math.PI) oNorm += Math.PI * 2;
    if (Math.abs(oNorm) > FOV / 2 + 0.1) continue;
    const osx = Math.floor(W / 2 + oNorm / FOV * W);
    const oSize = Math.max(2, Math.floor(H / oDist * 0.15));
    const osy = Math.floor(H / 2);
    if (osx >= 0 && osx < W && oDist < zBuf[Math.max(0, Math.min(W - 1, osx))]) {
      ctx.fillStyle = '#f80';
      ctx.beginPath();
      ctx.arc(osx, osy, oSize, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function renderBossHealthBar() {
  if (!boss.active) return;
  const barW = 200;
  const barH = 8;
  const barX = (W - barW) / 2;
  const barY = 4;
  // Background
  ctx.fillStyle = '#333';
  ctx.fillRect(barX, barY, barW, barH);
  // Health
  const ratio = Math.max(0, boss.hp / boss.maxHp);
  const hpColor = boss.phase === 3 ? '#f44' : boss.phase === 2 ? '#f80' : '#f00';
  ctx.fillStyle = hpColor;
  ctx.fillRect(barX, barY, barW * ratio, barH);
  // Border
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, barH);
  // Label
  ctx.fillStyle = '#fff';
  ctx.font = '7px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('DRILL MOTHER', W / 2, barY + barH + 8);
  ctx.textAlign = 'start';
}

// ========== INPUT ==========
const keysDown = {};
let mouseDX = 0;
let usePressed = false;

let fireHeld = false;
let automapVisible = false;

document.addEventListener('keydown', e => {
  keysDown[e.code] = true;

  // ===== Title screen =====
  if (gameState === 'title') {
    if (e.code === 'Enter') {
      gameState = 'difficultySelect';
    }
    return;
  }

  // ===== Difficulty select =====
  if (gameState === 'difficultySelect') {
    if (e.code === 'ArrowUp') {
      difficultySelectIndex = (difficultySelectIndex - 1 + DIFFICULTIES.length) % DIFFICULTIES.length;
    } else if (e.code === 'ArrowDown') {
      difficultySelectIndex = (difficultySelectIndex + 1) % DIFFICULTIES.length;
    } else if (e.code === 'Enter') {
      setDifficulty(difficultySelectIndex);
      loadLevel(0);
      gameState = 'playing';
    }
    return;
  }

  // ===== Pause menu =====
  if (gameState === 'paused') {
    if (e.code === 'Escape') {
      gameState = 'playing';
      return;
    }
    if (e.code === 'ArrowUp') {
      pauseMenuIndex = (pauseMenuIndex - 1 + 3) % 3;
    } else if (e.code === 'ArrowDown') {
      pauseMenuIndex = (pauseMenuIndex + 1) % 3;
    } else if (e.code === 'Enter') {
      if (pauseMenuIndex === 0) { // Resume
        gameState = 'playing';
      } else if (pauseMenuIndex === 1) { // Restart Level
        loadLevel(currentLevelIndex);
        gameState = 'playing';
      } else if (pauseMenuIndex === 2) { // Quit to Title
        gameState = 'title';
      }
    }
    return;
  }

  // ===== Game Over =====
  if (gameState === 'gameOver') {
    if (e.code === 'Enter') {
      loadLevel(currentLevelIndex);
      gameState = 'playing';
    }
    return;
  }

  // ===== Playing state =====
  if (e.code === 'Escape' && gameState === 'playing') {
    gameState = 'paused';
    pauseMenuIndex = 0;
    return;
  }

  if (e.code === 'KeyE') usePressed = true;
  // Weapon switching with number keys
  if (e.code >= 'Digit1' && e.code <= 'Digit6') {
    switchWeapon(parseInt(e.code.charAt(5)) - 1);
  }
  // Tab toggles automap
  if (e.code === 'Tab') {
    e.preventDefault();
    automapVisible = !automapVisible;
  }
  // M toggles audio mute
  if (e.code === 'KeyM') {
    audio.muted = !audio.muted;
  }
  // F toggles CRT filter
  if (e.code === 'KeyF') {
    crt = !crt;
  }
  // Enter to continue from level complete / stats screen
  if (e.code === 'Enter' && gameState === 'levelStats') {
    // Save progress
    if (currentLevelIndex + 1 > saveData.highestLevel) {
      saveData.highestLevel = currentLevelIndex + 1;
    }
    const levelName = LEVELS[currentLevelIndex].name;
    if (!saveData.bestTimes[levelName] || levelStats.elapsedTime < saveData.bestTimes[levelName]) {
      saveData.bestTimes[levelName] = levelStats.elapsedTime;
    }
    writeSaveData();

    if (currentLevelIndex + 1 < LEVELS.length) {
      loadLevel(currentLevelIndex + 1);
    } else {
      gameState = 'victory';
    }
  }
});
document.addEventListener('keyup', e => { keysDown[e.code] = false; });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement) mouseDX += e.movementX;
});
document.addEventListener('mousedown', e => {
  if (e.button === 0 && document.pointerLockElement) fireHeld = true;
});
document.addEventListener('mouseup', e => {
  if (e.button === 0) fireHeld = false;
});
document.addEventListener('wheel', e => {
  if (document.pointerLockElement) {
    const dir = e.deltaY > 0 ? 1 : -1;
    switchWeapon((currentWeapon + dir + weapons.length) % weapons.length);
  }
});

const canvas = document.getElementById('c');
canvas.addEventListener('click', () => { canvas.requestPointerLock(); });

// ========== DIFFICULTIES ==========
const DIFFICULTIES = [
  { name: 'Easy', damageMultiplier: 0.5, speedMultiplier: 0.8, countMultiplier: 0.8 },
  { name: 'Normal', damageMultiplier: 1.0, speedMultiplier: 1.0, countMultiplier: 1.0 },
  { name: 'Hard', damageMultiplier: 1.5, speedMultiplier: 1.2, countMultiplier: 1.3 },
  { name: 'Nightmare', damageMultiplier: 2.0, speedMultiplier: 1.5, countMultiplier: 1.5 }
];
let currentDifficulty = DIFFICULTIES[1]; // Normal by default
let difficultySelectIndex = 1;
let pauseMenuIndex = 0;

function setDifficulty(index) {
  if (index >= 0 && index < DIFFICULTIES.length) {
    currentDifficulty = DIFFICULTIES[index];
    difficultySelectIndex = index;
  }
}

// ========== SAVE DATA ==========
let saveData = { highestLevel: 0, bestTimes: {} };

function loadSaveData() {
  try {
    const raw = localStorage.getItem('ironhell_save');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        saveData = parsed;
      }
    }
  } catch (e) { /* localStorage unavailable */ }
}

function writeSaveData() {
  try {
    localStorage.setItem('ironhell_save', JSON.stringify(saveData));
  } catch (e) { /* localStorage unavailable */ }
}

loadSaveData();

// ========== PLAYER ==========
let gameState = 'title';

const player = {
  x: startX,
  y: startY,
  angle: 0,
  health: 100,
  armour: 0,
  keys: [],
  phaseSuit: false
};

let phaseSuitTimer = 0;

// ========== LEVEL STATS ==========
let currentLevelIndex = 0;
let graceTimer = 3.0;
let levelStats = {
  kills: 0,
  totalEnemies: 0,
  secretsFound: 0,
  totalSecrets: 0,
  itemsPickedUp: 0,
  totalItems: 0,
  startTime: 0,
  elapsedTime: 0
};

// ========== WEAPONS ==========
const weapons = [
  { name: 'Rivet Driver', ammoType: 'bullets', ammoCost: 1, damage: 15, fireRate: 0.3, spread: 0.02, pellets: 1, splash: 0, color: '#cc8' },
  { name: 'Scatter Bore', ammoType: 'shells', ammoCost: 1, damage: 10, fireRate: 0.7, spread: 0.1, pellets: 7, splash: 0, color: '#fa0' },
  { name: 'Chain Rivet', ammoType: 'bullets', ammoCost: 1, damage: 12, fireRate: 0.08, spread: 0.04, pellets: 1, splash: 0, color: '#ff0' },
  { name: 'Thermal Lance', ammoType: 'cells', ammoCost: 2, damage: 40, fireRate: 0.5, spread: 0, pellets: 1, splash: 0, color: '#0ff' },
  { name: 'Breach Launcher', ammoType: 'rockets', ammoCost: 1, damage: 80, fireRate: 0.8, spread: 0, pellets: 1, splash: ROCKET_SPLASH_RADIUS, color: '#f80' },
  { name: 'The Core', ammoType: 'cells', ammoCost: 10, damage: 200, fireRate: 2.0, spread: 0, pellets: 1, splash: 5, color: '#f0f' }
];

const ammo = { bullets: Infinity, shells: 20, rockets: 5, cells: 20 };
let currentWeapon = 0;
let fireCooldown = 0;
let weaponBob = 0;
let weaponRecoil = 0;
let muzzleFlash = 0;
let screenShake = 0;
let damageFlash = 0;

function switchWeapon(idx) {
  if (idx >= 0 && idx < weapons.length) currentWeapon = idx;
}

function fireWeapon() {
  if (fireCooldown > 0) return;
  const w = weapons[currentWeapon];
  if (ammo[w.ammoType] < w.ammoCost) return;
  if (ammo[w.ammoType] !== Infinity) ammo[w.ammoType] -= w.ammoCost;
  fireCooldown = w.fireRate;
  weaponRecoil = 6;
  muzzleFlash = 0.08;
  screenShake = 2;

  // Alert nearby enemies on weapon fire
  alertNearbyEnemies(player.x, player.y, 15);

  // Hitscan damage to enemies
  for (let p = 0; p < w.pellets; p++) {
    const spread = (Math.random() - 0.5) * w.spread * 2;
    const angle = player.angle + spread;
    const ray = castRay(player.x, player.y, angle);
    let closestEnemy = null;
    let closestDist = ray.dist;
    for (const e of enemies) {
      if (e.state === 'dead') continue;
      const edx = e.x - player.x;
      const edy = e.y - player.y;
      const eDist = Math.sqrt(edx * edx + edy * edy);
      if (eDist >= closestDist) continue;
      const eAngle = Math.atan2(edy, edx);
      let diff = eAngle - angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const hitWidth = 0.4 / eDist;
      if (Math.abs(diff) < hitWidth) {
        closestEnemy = e;
        closestDist = eDist;
      }
    }
    // Check boss hit
    let hitBoss = false;
    if (boss.active) {
      const bdx = boss.x - player.x;
      const bdy = boss.y - player.y;
      const bDist = Math.sqrt(bdx * bdx + bdy * bdy);
      if (bDist < closestDist) {
        const bAngle = Math.atan2(bdy, bdx);
        let bDiff = bAngle - angle;
        while (bDiff > Math.PI) bDiff -= Math.PI * 2;
        while (bDiff < -Math.PI) bDiff += Math.PI * 2;
        const bHitWidth = 0.6 / bDist;  // Wider hitbox for boss
        if (Math.abs(bDiff) < bHitWidth) {
          hitBoss = true;
          closestDist = bDist;
          closestEnemy = null; // boss takes priority at this distance
        }
      }
    }

    if (hitBoss) {
      boss.hp -= w.damage;
      updateBossPhase();
    } else if (closestEnemy) {
      damageEnemy(closestEnemy, w.damage, null);
    }
  }

  // Rocket splash hurts player at point of impact
  if (w.splash > 0) {
    const hit = castRay(player.x, player.y, player.angle);
    if (hit.dist < MAX_DEPTH) {
      const hitX = player.x + Math.cos(player.angle) * hit.dist;
      const hitY = player.y + Math.sin(player.angle) * hit.dist;
      const dx = player.x - hitX;
      const dy = player.y - hitY;
      const distToPlayer = Math.sqrt(dx * dx + dy * dy);
      if (distToPlayer < w.splash) {
        const falloff = 1 - distToPlayer / w.splash;
        const splashDmg = Math.floor(ROCKET_SPLASH_DAMAGE * falloff);
        player.health -= splashDmg;
        damageFlash = 0.3;
        screenShake = 5;
      }
    }
  }
}

function tryUseDoor(door) {
  if (door.opening) return;
  if (door.locked) {
    if (!player.keys.includes(door.locked)) return;
  }
  door.opening = true;
}

function activateExit() {
  gameState = 'levelComplete';
  levelStats.elapsedTime = (performance.now() - levelStats.startTime) / 1000;
  // Show stats screen after brief delay
  setTimeout(() => {
    if (gameState === 'levelComplete') {
      gameState = 'levelStats';
    }
  }, 500);
}

function handleUse() {
  if (!usePressed) return;
  usePressed = false;

  const lookX = Math.cos(player.angle);
  const lookY = Math.sin(player.angle);
  const checkX = Math.floor(player.x + lookX * 1.2);
  const checkY = Math.floor(player.y + lookY * 1.2);
  const cell = getCell(player.x + lookX * 1.2, player.y + lookY * 1.2);

  if (cell >= 10 && cell <= 13) {
    const door = doors.find(d => d.x === checkX && d.y === checkY);
    if (door) tryUseDoor(door);
  }
  if (cell === 20) {
    activateExit();
  }
  // Secret wall: open on E press
  if (cell === 40) {
    map[checkY][checkX] = 0; // open the secret wall
    levelStats.secretsFound++;
  }
}

function pickupItems() {
  for (const item of floorItems) {
    if (item.picked) continue;
    const dx = player.x - item.x;
    const dy = player.y - item.y;
    if (dx * dx + dy * dy < 0.5) {
      // Check if pickup would be wasted (health/armour at max)
      if (item.type === 'health_small' && player.health >= 100) continue;
      if (item.type === 'health_medium' && player.health >= 100) continue;
      if (item.type === 'armour_green' && player.armour >= 100) continue;

      item.picked = true;
      levelStats.itemsPickedUp++;

      if (item.type === 'key_red' && !player.keys.includes('red')) player.keys.push('red');
      if (item.type === 'key_blue' && !player.keys.includes('blue')) player.keys.push('blue');
      if (item.type === 'key_yellow' && !player.keys.includes('yellow')) player.keys.push('yellow');
      if (item.type === 'ammo_bullets' && ammo.bullets !== Infinity) ammo.bullets += 10;
      if (item.type === 'ammo_shells') ammo.shells += 4;
      if (item.type === 'ammo_rockets') ammo.rockets += 2;
      if (item.type === 'ammo_cells') ammo.cells += 10;
      if (item.type === 'health_small') player.health = Math.min(100, player.health + 10);
      if (item.type === 'health_medium') player.health = Math.min(100, player.health + 25);
      if (item.type === 'armour_green') player.armour = Math.min(100, player.armour + 50);
      if (item.type === 'phase_suit') {
        player.phaseSuit = true;
        phaseSuitTimer = PHASE_SUIT_DURATION;
      }
    }
  }
}

function updateDoors(dt) {
  for (const door of doors) {
    if (door.opening && door.open < 1) {
      door.open = Math.min(1, door.open + DOOR_SPEED * dt);
    }
    // Auto-open doors when player walks into them
    const dx = player.x - (door.x + 0.5);
    const dy = player.y - (door.y + 0.5);
    if (dx * dx + dy * dy < 1.5 && !door.opening) {
      if (!door.locked || player.keys.includes(door.locked)) {
        door.opening = true;
      }
    }
  }
}

function updateAcidDamage(dt) {
  const cell = getCell(player.x, player.y);
  if (cell === 30 && !player.phaseSuit) {
    player.health -= ACID_DAMAGE_PER_SEC * dt;
    damageFlash = Math.max(damageFlash, 0.1);
  }
}

function updatePhaseSuit(dt) {
  if (player.phaseSuit) {
    phaseSuitTimer -= dt;
    if (phaseSuitTimer <= 0) {
      player.phaseSuit = false;
      phaseSuitTimer = 0;
    }
  }
}

function movePlayer(dt) {
  if (gameState !== 'playing') return;

  let mx = 0, my = 0;
  const cos = Math.cos(player.angle);
  const sin = Math.sin(player.angle);

  if (keysDown['KeyW']) { mx += cos; my += sin; }
  if (keysDown['KeyS']) { mx -= cos; my -= sin; }
  if (keysDown['KeyA']) { mx += sin; my -= cos; }
  if (keysDown['KeyD']) { mx -= sin; my += cos; }

  const len = Math.sqrt(mx * mx + my * my);
  if (len > 0) { mx /= len; my /= len; }

  let speed = MOVE_SPEED;
  if (keysDown['ShiftLeft'] || keysDown['ShiftRight']) speed *= RUN_MULT;

  const dx = mx * speed * dt;
  const dy = my * speed * dt;

  const newX = player.x + dx;
  const newY = player.y + dy;

  if (!isSolid(newX + PLAYER_RADIUS * Math.sign(dx), player.y) &&
      !isSolid(newX - PLAYER_RADIUS * Math.sign(dx), player.y) &&
      !isSolid(newX, player.y + PLAYER_RADIUS) &&
      !isSolid(newX, player.y - PLAYER_RADIUS)) {
    player.x = newX;
  }

  if (!isSolid(player.x, newY + PLAYER_RADIUS * Math.sign(dy)) &&
      !isSolid(player.x, newY - PLAYER_RADIUS * Math.sign(dy)) &&
      !isSolid(player.x + PLAYER_RADIUS, newY) &&
      !isSolid(player.x - PLAYER_RADIUS, newY)) {
    player.y = newY;
  }

  player.angle += mouseDX * ROT_SPEED;
  mouseDX = 0;

  // Track visited cells for automap
  const cx = Math.floor(player.x);
  const cy = Math.floor(player.y);
  if (cy >= 0 && cy < mapH && cx >= 0 && cx < mapW) {
    visitedCells[cy][cx] = true;
  }

  handleUse();
  pickupItems();
  updateAcidDamage(dt > 0 ? dt : 0.016);
  updatePhaseSuit(dt > 0 ? dt : 0.016);
}

// ========== LEVEL LOADING ==========
function loadLevel(idx) {
  if (idx < 0 || idx >= LEVELS.length) return;
  currentLevelIndex = idx;
  const level = LEVELS[idx];

  // Clear arrays
  map.length = 0;
  doors.length = 0;
  enemies.length = 0;
  floorItems.length = 0;
  visitedCells.length = 0;

  mapH = level.map.length;
  mapW = level.map[0].length;

  let enemyCount = 0;
  let itemCount = 0;

  for (let y = 0; y < mapH; y++) {
    map[y] = [];
    visitedCells[y] = [];
    for (let x = 0; x < mapW; x++) {
      visitedCells[y][x] = false;
      const ch = level.map[y][x];
      switch (ch) {
        case 'P': startX = x + 0.5; startY = y + 0.5; map[y][x] = 0; break;
        case '#': map[y][x] = 1; break;
        case 'D': map[y][x] = 10; doors.push({ x, y, type: 'door', open: 0, opening: false, locked: null }); break;
        case 'R': map[y][x] = 11; doors.push({ x, y, type: 'doorRed', open: 0, opening: false, locked: 'red' }); break;
        case 'B': map[y][x] = 12; doors.push({ x, y, type: 'doorBlue', open: 0, opening: false, locked: 'blue' }); break;
        case 'Y': map[y][x] = 13; doors.push({ x, y, type: 'doorYellow', open: 0, opening: false, locked: 'yellow' }); break;
        case 'X': map[y][x] = 20; break;
        case '~': map[y][x] = 30; break; // acid floor
        case 'S': map[y][x] = 40; break; // secret wall
        case '^': map[y][x] = 0; break;  // lift tile (visual only for now)
        case 'r': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'key_red', picked: false }); itemCount++; break;
        case 'b': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'key_blue', picked: false }); itemCount++; break;
        case 'y': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'key_yellow', picked: false }); itemCount++; break;
        case '+': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'health_small', picked: false }); itemCount++; break;
        case 'H': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'health_medium', picked: false }); itemCount++; break;
        case 'A': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'armour_green', picked: false }); itemCount++; break;
        case 'p': map[y][x] = 0; floorItems.push({ x: x + 0.5, y: y + 0.5, type: 'phase_suit', picked: false }); itemCount++; break;
        case 'h': case 's': case 'g': case 'w': case 'f':
          map[y][x] = 0; enemyCount++; break; // enemies parsed in second pass
        default: map[y][x] = 0; break;
      }
    }
  }

  // Parse enemies from map (second pass)
  for (let y = 0; y < mapH; y++) {
    for (let x = 0; x < mapW; x++) {
      const ch = level.map[y][x];
      if ('hsgwf'.includes(ch)) spawnEnemy(ch, x, y);
    }
  }

  // Reset player
  player.x = startX;
  player.y = startY;
  player.angle = 0;
  player.health = 100;
  player.armour = 0;
  player.keys = [];
  player.phaseSuit = false;
  phaseSuitTimer = 0;

  // Reset weapons/ammo
  ammo.bullets = Infinity;
  ammo.shells = 20;
  ammo.rockets = 5;
  ammo.cells = 20;
  currentWeapon = 0;
  fireCooldown = 0;

  // Reset level stats
  levelStats = {
    kills: 0,
    totalEnemies: enemyCount,
    secretsFound: 0,
    totalSecrets: level.secrets,
    itemsPickedUp: 0,
    totalItems: itemCount,
    startTime: performance.now(),
    elapsedTime: 0
  };

  gameState = 'playing';
  automapVisible = false;
  graceTimer = 3.0;

  // Spawn boss on level 4 (The Bore)
  boss.active = false;
  bossOrbs.length = 0;
  if (idx === 4) {
    spawnBoss(Math.floor(mapW / 2) + 0.5, Math.floor(mapH / 2) + 0.5);
  }
}

// Don't auto-load level; game starts in 'title' state
// loadLevel(0) is called when difficulty is selected

// ========== RENDER ==========
const ctx = (() => {
  canvas.width = W;
  canvas.height = H;
  function resize() {
    const scaleX = window.innerWidth / W;
    const scaleY = window.innerHeight / H;
    const scale = Math.min(scaleX, scaleY);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  resize();
  window.addEventListener('resize', resize);
  return canvas.getContext('2d');
})();

const imgData = ctx.createImageData(W, H);
const buf = imgData.data;
const zBuf = new Float32Array(W);

function getTextureForCell(cell) {
  if (cell >= 1 && cell <= 3) return textures[WALL_TEXTURES[cell]] || textures['rustyMetal'];
  if (cell === 10) return textures['door'];
  if (cell === 11) return textures['doorRed'];
  if (cell === 12) return textures['doorBlue'];
  if (cell === 13) return textures['doorYellow'];
  if (cell === 20) return textures['exitSwitch'];
  if (cell === 40) return textures['secretWall'];
  return textures['rustyMetal'];
}

function castRay(ox, oy, angle) {
  const dx = Math.cos(angle);
  const dy = Math.sin(angle);

  let mapX = Math.floor(ox);
  let mapY = Math.floor(oy);

  const stepX = dx >= 0 ? 1 : -1;
  const stepY = dy >= 0 ? 1 : -1;

  let tMaxX = dx !== 0 ? ((dx >= 0 ? mapX + 1 : mapX) - ox) / dx : 1e30;
  let tMaxY = dy !== 0 ? ((dy >= 0 ? mapY + 1 : mapY) - oy) / dy : 1e30;

  const tDeltaX = dx !== 0 ? Math.abs(1 / dx) : 1e30;
  const tDeltaY = dy !== 0 ? Math.abs(1 / dy) : 1e30;

  let side = 0;
  let dist = 0;

  for (let i = 0; i < 64; i++) {
    if (tMaxX < tMaxY) {
      dist = tMaxX;
      tMaxX += tDeltaX;
      mapX += stepX;
      side = 0;
    } else {
      dist = tMaxY;
      tMaxY += tDeltaY;
      mapY += stepY;
      side = 1;
    }

    if (mapX < 0 || mapX >= mapW || mapY < 0 || mapY >= mapH) break;
    const cell = map[mapY][mapX];
    if (cell !== 0 && cell !== 30) { // acid floor (30) doesn't block rays
      // Doors that are fully open don't block rays
      if (cell >= 10 && cell <= 13) {
        const door = doors.find(d => d.x === mapX && d.y === mapY);
        if (door && door.open >= 0.9) continue;
      }
      // Compute wall hit X for texturing
      let wallX;
      if (side === 0) {
        wallX = oy + dist * dy;
      } else {
        wallX = ox + dist * dx;
      }
      wallX -= Math.floor(wallX);
      return { dist, side, mapX, mapY, cell, wallX };
    }
  }

  return { dist: MAX_DEPTH, side: 0, mapX: 0, mapY: 0, cell: 0, wallX: 0 };
}

function sampleTexture(texData, u, v) {
  const tx = Math.floor(u * TEX_SIZE) & (TEX_SIZE - 1);
  const ty = Math.floor(v * TEX_SIZE) & (TEX_SIZE - 1);
  const idx = (ty * TEX_SIZE + tx) * 4;
  return [texData[idx], texData[idx + 1], texData[idx + 2]];
}

function renderAutomap() {
  // Draw automap overlay
  const scale = 6;
  const offsetX = 10;
  const offsetY = 10;
  const maxDrawW = W - 20;
  const maxDrawH = H - HUD_H - 20;

  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H - HUD_H);

  // Center map on player
  const pcx = Math.floor(player.x);
  const pcy = Math.floor(player.y);
  const viewRadius = Math.floor(Math.min(maxDrawW, maxDrawH) / scale / 2);

  for (let my = 0; my < mapH; my++) {
    for (let mx = 0; mx < mapW; mx++) {
      const sx = offsetX + (mx - pcx + viewRadius) * scale + maxDrawW / 2 - viewRadius * scale;
      const sy = offsetY + (my - pcy + viewRadius) * scale + maxDrawH / 2 - viewRadius * scale;

      if (sx < 0 || sx + scale > W || sy < 0 || sy + scale > H - HUD_H) continue;

      const cell = map[my][mx];
      const visited = visitedCells[my] && visitedCells[my][mx];

      if (cell >= 1 && cell <= 3 || cell === 40) {
        // Wall or secret wall
        ctx.fillStyle = visited ? '#fff' : '#444';
        ctx.fillRect(sx, sy, scale, scale);
      } else if (cell >= 10 && cell <= 13) {
        // Door
        const colors = { 10: '#a86', 11: '#f44', 12: '#44f', 13: '#ff4' };
        ctx.fillStyle = colors[cell] || '#a86';
        ctx.fillRect(sx, sy, scale, scale);
      } else if (cell === 20) {
        ctx.fillStyle = '#0f0';
        ctx.fillRect(sx, sy, scale, scale);
      } else if (cell === 30) {
        // Acid
        if (visited) {
          ctx.fillStyle = '#0a0';
          ctx.fillRect(sx, sy, scale, scale);
        }
      } else if (visited) {
        ctx.fillStyle = '#222';
        ctx.fillRect(sx, sy, scale, scale);
      }
    }
  }

  // Player position and direction
  const px = offsetX + (player.x - pcx + viewRadius) * scale + maxDrawW / 2 - viewRadius * scale;
  const py = offsetY + (player.y - pcy + viewRadius) * scale + maxDrawH / 2 - viewRadius * scale;
  ctx.fillStyle = '#0f0';
  ctx.beginPath();
  ctx.arc(px, py, 3, 0, Math.PI * 2);
  ctx.fill();

  // Direction indicator
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(player.angle) * 8, py + Math.sin(player.angle) * 8);
  ctx.stroke();

  // Level name
  ctx.fillStyle = '#0f0';
  ctx.font = '8px monospace';
  ctx.fillText('MAP: ' + LEVELS[currentLevelIndex].name, offsetX, H - HUD_H - 4);
}

function renderLevelStats() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#0f0';
  ctx.font = '16px monospace';
  ctx.fillText('LEVEL COMPLETE', W / 2, 30);

  ctx.fillStyle = '#ff0';
  ctx.font = '12px monospace';
  ctx.fillText(LEVELS[currentLevelIndex].name.toUpperCase(), W / 2, 50);

  const statsY = 75;
  const lineH = 20;
  ctx.font = '10px monospace';

  // Kills
  const killPct = levelStats.totalEnemies > 0 ? Math.floor(levelStats.kills / levelStats.totalEnemies * 100) : 100;
  ctx.fillStyle = '#fff';
  ctx.fillText('KILLS: ' + killPct + '%  (' + levelStats.kills + '/' + levelStats.totalEnemies + ')', W / 2, statsY);

  // Items
  const itemPct = levelStats.totalItems > 0 ? Math.floor(levelStats.itemsPickedUp / levelStats.totalItems * 100) : 100;
  ctx.fillText('ITEMS: ' + itemPct + '%  (' + levelStats.itemsPickedUp + '/' + levelStats.totalItems + ')', W / 2, statsY + lineH);

  // Secrets
  const secretPct = levelStats.totalSecrets > 0 ? Math.floor(levelStats.secretsFound / levelStats.totalSecrets * 100) : 100;
  ctx.fillText('SECRETS: ' + secretPct + '%  (' + levelStats.secretsFound + '/' + levelStats.totalSecrets + ')', W / 2, statsY + lineH * 2);

  // Time
  const timeStr = Math.floor(levelStats.elapsedTime) + 's';
  const parStr = LEVELS[currentLevelIndex].par + 's';
  const timeColor = levelStats.elapsedTime <= LEVELS[currentLevelIndex].par ? '#0f0' : '#f44';
  ctx.fillStyle = timeColor;
  ctx.fillText('TIME: ' + timeStr + '  PAR: ' + parStr, W / 2, statsY + lineH * 3);

  // Continue prompt
  ctx.fillStyle = '#888';
  ctx.font = '9px monospace';
  if (currentLevelIndex + 1 < LEVELS.length) {
    ctx.fillText('PRESS ENTER TO CONTINUE', W / 2, statsY + lineH * 5);
  } else {
    ctx.fillStyle = '#0f0';
    ctx.fillText('ALL LEVELS COMPLETE!', W / 2, statsY + lineH * 5);
  }

  ctx.textAlign = 'start';
}

function render() {
  // Floor and ceiling with distance shading
  const halfH = H / 2;
  for (let y = 0; y < H; y++) {
    const isCeiling = y < halfH;
    const rowDist = halfH / Math.abs(y - halfH + 0.01);
    const fog = Math.max(0, Math.min(1, 1 - rowDist / MAX_DEPTH));

    for (let x = 0; x < W; x++) {
      const rayAngle = player.angle - FOV / 2 + (x / W) * FOV;
      const floorX = player.x + rowDist * Math.cos(rayAngle);
      const floorY = player.y + rowDist * Math.sin(rayAngle);

      const idx = (y * W + x) * 4;

      // Check if this floor pixel is on an acid tile
      const fmx = Math.floor(floorX);
      const fmy = Math.floor(floorY);
      const isAcid = !isCeiling && fmx >= 0 && fmx < mapW && fmy >= 0 && fmy < mapH && map[fmy][fmx] === 30;

      if (isCeiling) {
        const cx = ((floorX * 4) & 7);
        const cy = ((floorY * 4) & 7);
        const checker = ((cx >> 2) ^ (cy >> 2)) ? 50 : 40;
        buf[idx] = Math.floor(checker * fog);
        buf[idx + 1] = Math.floor(checker * fog);
        buf[idx + 2] = Math.floor((checker + 10) * fog);
      } else if (isAcid) {
        // Green acid floor
        const glow = Math.sin(performance.now() / 500 + floorX * 3 + floorY * 2) * 15;
        buf[idx] = Math.floor(10 * fog);
        buf[idx + 1] = Math.floor(Math.max(0, Math.min(255, (80 + glow) * fog)));
        buf[idx + 2] = Math.floor(5 * fog);
      } else {
        const fx = ((floorX * 4) & 7);
        const fy = ((floorY * 4) & 7);
        const checker = ((fx >> 2) ^ (fy >> 2)) ? 70 : 55;
        buf[idx] = Math.floor(checker * fog);
        buf[idx + 1] = Math.floor((checker - 10) * fog);
        buf[idx + 2] = Math.floor((checker - 20) * fog);
      }
      buf[idx + 3] = 255;
    }
  }

  // Walls
  for (let col = 0; col < W; col++) {
    const rayAngle = player.angle - FOV / 2 + (col / W) * FOV;
    const hit = castRay(player.x, player.y, rayAngle);

    const perpDist = hit.dist * Math.cos(rayAngle - player.angle);
    zBuf[col] = perpDist;
    const wallH = Math.min(H * 2, H / perpDist);
    const wallTop = Math.floor((H - wallH) / 2);
    const wallBot = Math.floor((H + wallH) / 2);

    const shade = hit.side === 1 ? 0.7 : 1.0;
    const fog = Math.max(0, 1 - perpDist / MAX_DEPTH);
    const tex = getTextureForCell(hit.cell);

    for (let y = Math.max(0, wallTop); y < Math.min(H, wallBot); y++) {
      const v = (y - wallTop) / (wallBot - wallTop);
      const idx = (y * W + col) * 4;

      if (tex) {
        const [tr, tg, tb] = sampleTexture(tex, hit.wallX, v);
        buf[idx] = Math.floor(tr * shade * fog);
        buf[idx + 1] = Math.floor(tg * shade * fog);
        buf[idx + 2] = Math.floor(tb * shade * fog);
      } else {
        buf[idx] = Math.floor(150 * shade * fog);
        buf[idx + 1] = Math.floor(120 * shade * fog);
        buf[idx + 2] = Math.floor(100 * shade * fog);
      }
      buf[idx + 3] = 255;
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Screen shake offset
  const shakeX = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 2 : 0;
  const shakeY = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 2 : 0;
  if (screenShake > 0) ctx.translate(shakeX, shakeY);

  // Draw floor items (keys, pickups as sprites)
  for (const item of floorItems) {
    if (item.picked) continue;
    const dx = item.x - player.x;
    const dy = item.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.3 || dist > MAX_DEPTH) continue;

    const angle = Math.atan2(dy, dx) - player.angle;
    let normAngle = angle;
    while (normAngle > Math.PI) normAngle -= Math.PI * 2;
    while (normAngle < -Math.PI) normAngle += Math.PI * 2;

    if (Math.abs(normAngle) > FOV / 2 + 0.1) continue;

    const screenX = Math.floor(W / 2 + normAngle / FOV * W);
    const spriteH = Math.floor(H / dist * 0.3);
    const spriteW = spriteH;
    const sy = Math.floor(H / 2 + spriteH / 2);

    if (dist < zBuf[Math.max(0, Math.min(W - 1, screenX))]) {
      let color = '#fff';
      if (item.type === 'key_red') color = '#f44';
      else if (item.type === 'key_blue') color = '#44f';
      else if (item.type === 'key_yellow') color = '#ff4';
      else if (item.type === 'health_small') color = '#4f4';
      else if (item.type === 'health_medium') color = '#4f4';
      else if (item.type === 'armour_green') color = '#0a0';
      else if (item.type === 'phase_suit') color = '#0ff';
      else if (item.type.startsWith('ammo_')) color = '#aa0';

      ctx.fillStyle = color;
      ctx.fillRect(screenX - spriteW / 2, sy - spriteH, spriteW, spriteH);

      // Icon indicators
      if (item.type === 'key_red' || item.type === 'key_blue' || item.type === 'key_yellow') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(screenX - 1, sy - spriteH + 2, 2, spriteH - 4);
      } else if (item.type === 'health_small' || item.type === 'health_medium') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(screenX - spriteW / 4, sy - spriteH / 2 - 1, spriteW / 2, 2);
        ctx.fillRect(screenX - 1, sy - spriteH * 0.7, 2, spriteH * 0.4);
      }
    }
  }

  // Render enemies (billboard sprites)
  renderEnemies();

  // Render boss
  renderBoss();
  renderBossHealthBar();

  // Weapon sprite (bottom center with bob and recoil)
  const w = weapons[currentWeapon];
  const bobX = Math.sin(weaponBob) * 3;
  const bobY = Math.abs(Math.cos(weaponBob)) * 2;
  const recoilY = Math.max(0, weaponRecoil);
  const wpnX = W / 2 - 20 + bobX;
  const wpnY = H - HUD_H - 50 + bobY + recoilY;

  // Muzzle flash
  if (muzzleFlash > 0) {
    ctx.fillStyle = w.color;
    ctx.globalAlpha = muzzleFlash * 10;
    ctx.fillRect(wpnX - 5, wpnY - 15, 50, 15);
    ctx.globalAlpha = 1;
  }

  // Weapon body
  ctx.fillStyle = '#555';
  ctx.fillRect(wpnX, wpnY, 40, 50);
  ctx.fillStyle = '#777';
  ctx.fillRect(wpnX + 5, wpnY, 30, 10);
  ctx.fillStyle = w.color;
  ctx.fillRect(wpnX + 12, wpnY - 5, 16, 8);
  // Barrel
  ctx.fillStyle = '#333';
  ctx.fillRect(wpnX + 16, wpnY - 10, 8, 10);

  // HUD bar (Doom-style bottom bar)
  const hudY = H - HUD_H;
  ctx.fillStyle = '#333';
  ctx.fillRect(0, hudY, W, HUD_H);
  ctx.fillStyle = '#555';
  ctx.fillRect(0, hudY, W, 2);

  ctx.font = '9px monospace';

  // Health
  ctx.fillStyle = '#f44';
  ctx.fillText('HP', 4, hudY + 12);
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.max(0, Math.floor(player.health)).toString(), 4, hudY + 24);

  // Armour
  ctx.fillStyle = '#48f';
  ctx.fillText('AR', 44, hudY + 12);
  ctx.fillStyle = '#fff';
  ctx.fillText(player.armour.toString(), 44, hudY + 24);

  // Current ammo
  const curAmmo = ammo[w.ammoType];
  ctx.fillStyle = w.color;
  ctx.fillText(w.name, 84, hudY + 12);
  ctx.fillStyle = '#fff';
  ctx.fillText(curAmmo === Infinity ? 'INF' : curAmmo.toString(), 84, hudY + 24);

  // All ammo counts
  ctx.fillStyle = '#888';
  ctx.font = '7px monospace';
  ctx.fillText(`BUL:${ammo.bullets === Infinity ? 'INF' : ammo.bullets} SHL:${ammo.shells} RKT:${ammo.rockets} CEL:${ammo.cells}`, 160, hudY + 12);

  // Keys in HUD
  const keyColors = { red: '#f44', blue: '#44f', yellow: '#ff4' };
  let kx = 160;
  for (const k of player.keys) {
    ctx.fillStyle = keyColors[k] || '#fff';
    ctx.fillRect(kx, hudY + 16, 10, 10);
    kx += 14;
  }

  // Phase suit indicator
  if (player.phaseSuit) {
    ctx.fillStyle = '#0ff';
    ctx.font = '7px monospace';
    ctx.fillText('SUIT:' + Math.ceil(phaseSuitTimer) + 's', 220, hudY + 24);
  }

  // Level name in HUD
  ctx.fillStyle = '#888';
  ctx.font = '7px monospace';
  ctx.fillText('L' + (currentLevelIndex + 1) + ':' + LEVELS[currentLevelIndex].name, 260, hudY + 24);

  // Reactive pixel face (simplified)
  const faceX = W / 2 - 8;
  const faceY = hudY + 4;
  ctx.fillStyle = '#da8';
  ctx.fillRect(faceX, faceY, 16, 20);
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(faceX + 3, faceY + 5, 4, 4);
  ctx.fillRect(faceX + 9, faceY + 5, 4, 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(faceX + 4, faceY + 6, 2, 2);
  ctx.fillRect(faceX + 10, faceY + 6, 2, 2);
  // Mouth - changes with health
  if (player.health > 60) {
    ctx.fillStyle = '#a00';
    ctx.fillRect(faceX + 5, faceY + 14, 6, 3);
  } else if (player.health > 30) {
    ctx.fillStyle = '#a00';
    ctx.fillRect(faceX + 4, faceY + 14, 8, 2);
  } else {
    ctx.fillStyle = '#a00';
    ctx.fillRect(faceX + 3, faceY + 13, 10, 4);
    ctx.fillStyle = '#f00';
    ctx.fillRect(faceX + 5, faceY + 14, 6, 2);
  }

  // Damage flash
  if (damageFlash > 0) {
    ctx.fillStyle = `rgba(255,0,0,${damageFlash * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Reset shake transform
  if (screenShake > 0) ctx.translate(-shakeX, -shakeY);

  // Automap overlay
  if (automapVisible && gameState === 'playing') {
    renderAutomap();
  }

  // Level complete overlay (brief flash before stats)
  if (gameState === 'levelComplete') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0f0';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL COMPLETE', W / 2, H / 2);
    ctx.textAlign = 'start';
  }

  // Level stats screen
  if (gameState === 'levelStats') {
    renderLevelStats();
  }

  // CRT filter overlay (before game state overlays so they appear on top)
  renderCRT();

  // Title screen
  if (gameState === 'title') {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f80';
    ctx.font = '24px monospace';
    ctx.fillText('IRONHELL', W / 2, H / 2 - 20);
    ctx.fillStyle = '#888';
    ctx.font = '10px monospace';
    ctx.fillText('Press Enter', W / 2, H / 2 + 20);
    ctx.textAlign = 'start';
  }

  // Difficulty select screen
  if (gameState === 'difficultySelect') {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f80';
    ctx.font = '16px monospace';
    ctx.fillText('SELECT DIFFICULTY', W / 2, 40);
    ctx.font = '10px monospace';
    for (let i = 0; i < DIFFICULTIES.length; i++) {
      ctx.fillStyle = i === difficultySelectIndex ? '#ff0' : '#888';
      const prefix = i === difficultySelectIndex ? '> ' : '  ';
      ctx.fillText(prefix + DIFFICULTIES[i].name, W / 2, 80 + i * 24);
    }
    ctx.textAlign = 'start';
  }

  // Pause menu
  if (gameState === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff0';
    ctx.font = '16px monospace';
    ctx.fillText('PAUSED', W / 2, 50);
    const pauseItems = ['Resume', 'Restart Level', 'Quit to Title'];
    ctx.font = '10px monospace';
    for (let i = 0; i < pauseItems.length; i++) {
      ctx.fillStyle = i === pauseMenuIndex ? '#ff0' : '#888';
      const prefix = i === pauseMenuIndex ? '> ' : '  ';
      ctx.fillText(prefix + pauseItems[i], W / 2, 90 + i * 24);
    }
    ctx.textAlign = 'start';
  }

  // Game Over screen
  if (gameState === 'gameOver') {
    ctx.fillStyle = 'rgba(128,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f44';
    ctx.font = '20px monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
    ctx.fillStyle = '#888';
    ctx.font = '10px monospace';
    ctx.fillText('Press Enter to restart', W / 2, H / 2 + 20);
    ctx.textAlign = 'start';
  }

  // Victory screen
  if (gameState === 'victory') {
    ctx.fillStyle = 'rgba(0,0,0,0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f80';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('IRONHELL', W / 2, 30);
    ctx.fillStyle = '#0f0';
    ctx.font = '16px monospace';
    ctx.fillText('EPISODE COMPLETE', W / 2, 55);

    // Episode stats
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    const statsY = 80;
    const lineH = 16;
    const killPct = levelStats.totalEnemies > 0 ? Math.floor(levelStats.kills / levelStats.totalEnemies * 100) : 100;
    ctx.fillText('KILLS: ' + killPct + '%', W / 2, statsY);
    const itemPct = levelStats.totalItems > 0 ? Math.floor(levelStats.itemsPickedUp / levelStats.totalItems * 100) : 100;
    ctx.fillText('ITEMS: ' + itemPct + '%', W / 2, statsY + lineH);
    const secretPct = levelStats.totalSecrets > 0 ? Math.floor(levelStats.secretsFound / levelStats.totalSecrets * 100) : 100;
    ctx.fillText('SECRETS: ' + secretPct + '%', W / 2, statsY + lineH * 2);
    const timeStr = Math.floor(levelStats.elapsedTime) + 's';
    ctx.fillText('TIME: ' + timeStr, W / 2, statsY + lineH * 3);

    ctx.fillStyle = '#888';
    ctx.font = '9px monospace';
    ctx.fillText('THE DRILL MOTHER IS DEFEATED', W / 2, statsY + lineH * 5);
    ctx.textAlign = 'start';
  }
}

// ========== LOOP ==========
let lastTime = 0;
let frameCount = 0;
let fpsTime = 0;
const fpsEl = document.getElementById('fps');

function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  if (gameState === 'playing') {
    if (graceTimer > 0) graceTimer -= dt;
    movePlayer(dt);
    updateDoors(dt);
    updateEnemies(dt);
    updateBoss(dt);

    // Check for game over
    if (player.health <= 0) {
      player.health = 0;
      gameState = 'gameOver';
    }
  }

  // Weapon updates
  if (fireCooldown > 0) fireCooldown -= dt;
  if (fireHeld && gameState === 'playing') fireWeapon();
  if (weaponRecoil > 0) weaponRecoil -= dt * 40;
  if (muzzleFlash > 0) muzzleFlash -= dt;
  if (screenShake > 0) screenShake -= dt * 15;
  if (damageFlash > 0) damageFlash -= dt;
  weaponBob += dt * 5;

  render();

  frameCount++;
  fpsTime += dt;
  if (fpsTime >= 1) {
    fpsEl.textContent = Math.round(frameCount / fpsTime) + ' FPS';
    frameCount = 0;
    fpsTime = 0;
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

function initAudioContext() {
  if (audio.ctx) return;
  try {
    audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    // AudioContext not available (e.g. headless browser)
  }
}

// Lazily create AudioContext on first user interaction
document.addEventListener('click', initAudioContext, { once: false });
document.addEventListener('keydown', initAudioContext, { once: false });

function playSound(name, x, y) {
  if (audio.muted) return;
  if (!audio.ctx) return;
  const soundDef = audio.sounds[name];
  if (!soundDef) return;
  const params = soundDef();

  try {
    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    const panner = audio.ctx.createStereoPanner();

    // Calculate distance and panning from player
    const dx = x - player.x;
    const dy = y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = MAX_DEPTH;
    const volume = Math.max(0, 1 - dist / maxDist);

    // Stereo panning based on angle relative to player
    const angleToSound = Math.atan2(dy, dx) - player.angle;
    const pan = Math.max(-1, Math.min(1, Math.sin(angleToSound)));

    osc.type = params.type || 'square';
    osc.frequency.value = params.frequency || 440;
    gain.gain.value = volume * 0.3;
    panner.pan.value = pan;

    osc.connect(gain);
    gain.connect(panner);
    panner.connect(audio.ctx.destination);

    osc.start();
    osc.stop(audio.ctx.currentTime + (params.duration || 0.1));
  } catch (e) {
    // Ignore audio errors
  }
}

// Music - looping synth-metal generated in code
let musicOsc = null;
let musicGain = null;

function startMusic() {
  if (!audio.ctx) return;
  if (musicOsc) return;
  try {
    musicOsc = audio.ctx.createOscillator();
    musicGain = audio.ctx.createGain();
    musicOsc.type = 'sawtooth';
    musicOsc.frequency.value = 55; // low A drone
    musicGain.gain.value = audio.muted ? 0 : 0.05;
    musicOsc.connect(musicGain);
    musicGain.connect(audio.ctx.destination);
    musicOsc.start();
  } catch (e) {
    musicOsc = null;
    musicGain = null;
  }
}

// ========== CRT FILTER ==========
let crt = false;

function renderCRT() {
  if (!crt) return;

  // Scanlines: horizontal semi-transparent dark lines every 2 pixels
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  for (let y = 0; y < H; y += 2) {
    ctx.fillRect(0, y, W, 1);
  }

  // Vignette: radial darkening toward edges
  const grd = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
  grd.addColorStop(0, 'rgba(0,0,0,0)');
  grd.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
}
